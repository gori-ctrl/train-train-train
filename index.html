function WorkoutTracker() {
  const [entries, setEntries] = useState([]);
  const [bodyWeightLog, setBodyWeightLog] = useState([]);
  const [runLog, setRunLog] = useState([]);
  const [routines, setRoutines] = useState([]);
  const [goals, setGoals] = useState({});
  const [notes, setNotes] = useState({});
  const [customExercises, setCustomExercises] = useState({});
  const [customBodyweightNames, setCustomBodyweightNames] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [editingEntry, setEditingEntry] = useState(null);
  const [loading, setLoading] = useState(true);
  const [mode, setMode] = useState("idle"); // idle | picking | logging | routine_building
  const [pendingExercise, setPendingExercise] = useState(null);
  const [routineQueue, setRoutineQueue] = useState(null);
  const [routineIndex, setRoutineIndex] = useState(0);
  const [routineName, setRoutineName] = useState("");
  const [isCircuitActive, setIsCircuitActive] = useState(false);
  const [roundCount, setRoundCount] = useState(1);
  const [tab, setTab] = useState("today"); // today | home | history | analysis | menu | cardio | bodyweight | nutrition | goals
  const [logDate, setLogDate] = useState(todayStr());
  const [sessions, setSessions] = useState({});
  const [activeSession, setActiveSession] = useState(null);
  const [lastBackupAt, setLastBackupAt] = useState(null);
  const [undoDelete, setUndoDelete] = useState(null); // { entry, index }
  const [machineDefaults, setMachineDefaults] = useState({});
  const undoTimerRef = useRef(null);
  const [storageProtected, setStorageProtected] = useState(null);
  useEffect(() => {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then((already) => already ? true : navigator.storage.persist())
          .then((ok) => setStorageProtected(!!ok)).catch(() => {});
      }
    } catch (e) {}
  }, []);
  const [nutrition, setNutrition] = useState({});
  const [nutritionGoal, setNutritionGoal] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    try {
      const raw = JSON.parse(localStorage.getItem(ENTRIES_KEY) || "[]");
      setEntries(Array.isArray(raw) ? raw : []);
      const bw = JSON.parse(localStorage.getItem(BODYWEIGHT_LOG_KEY) || "[]");
      setBodyWeightLog(Array.isArray(bw) ? bw : []);
      const rl = JSON.parse(localStorage.getItem(RUN_LOG_KEY) || "[]");
      setRunLog(Array.isArray(rl) ? rl : []);
      const rt = JSON.parse(localStorage.getItem(ROUTINES_KEY) || "[]");
      setRoutines(Array.isArray(rt) ? rt : []);
      const gl = JSON.parse(localStorage.getItem(GOALS_KEY) || "{}");
      setGoals(gl && typeof gl === "object" ? gl : {});
      const nt = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
      setNotes(nt && typeof nt === "object" ? nt : {});
      const ce = JSON.parse(localStorage.getItem(CUSTOM_EX_KEY) || "{}");
      setCustomExercises(ce && typeof ce === "object" ? ce : {});
      const cbw = JSON.parse(localStorage.getItem(CUSTOM_BW_KEY) || "[]");
      setCustomBodyweightNames(Array.isArray(cbw) ? cbw : []);
      const fav = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
      setFavorites(Array.isArray(fav) ? fav : []);
      const ss = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
      setSessions(ss && typeof ss === "object" && !Array.isArray(ss) ? ss : {});
      const act = JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY) || "null");
      setActiveSession(act && typeof act.startedAt === "number" ? act : null);
      const nu = JSON.parse(localStorage.getItem(NUTRITION_KEY) || "{}");
      setNutrition(nu && typeof nu === "object" && !Array.isArray(nu) ? nu : {});
      const md = JSON.parse(localStorage.getItem(MACHINE_DEFAULTS_KEY) || "{}");
      setMachineDefaults(md && typeof md === "object" && !Array.isArray(md) ? md : {});
      const ng = parseFloat(localStorage.getItem(NUTRITION_GOAL_KEY) || "");
      setNutritionGoal(isNaN(ng) ? null : ng);
      const lb = parseInt(localStorage.getItem(LAST_BACKUP_KEY) || "", 10);
      setLastBackupAt(isNaN(lb) ? null : lb);
    } catch (e) {
      setEntries([]);
      setBodyWeightLog([]);
      setRunLog([]);
      setRoutines([]);
      setGoals({});
      setNotes({});
      setCustomExercises({});
      setCustomBodyweightNames([]);
      setFavorites([]);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  function handleAddBodyWeight(weight) {
    const date = todayStr();
    const next = [...bodyWeightLog.filter((e) => e.date !== date), { date, weight }];
    localStorage.setItem(BODYWEIGHT_LOG_KEY, JSON.stringify(next));
    setBodyWeightLog(next);
  }

  function handleDeleteBodyWeight(date) {
    const next = bodyWeightLog.filter((e) => e.date !== date);
    localStorage.setItem(BODYWEIGHT_LOG_KEY, JSON.stringify(next));
    setBodyWeightLog(next);
  }

  function handleAddRun(data) {
    const run = { id: `${Date.now()}`, type: data.type || "run", date: data.date, distanceKm: data.distanceKm, durationSec: data.durationSec, load: data.load || "" };
    const next = [run, ...runLog];
    localStorage.setItem(RUN_LOG_KEY, JSON.stringify(next));
    setRunLog(next);
  }

  function handleUpdateRun(id, data) {
    const next = runLog.map((r) => (r.id === id ? { ...r, ...data } : r));
    localStorage.setItem(RUN_LOG_KEY, JSON.stringify(next));
    setRunLog(next);
  }

  function handleDeleteRun(id) {
    const next = runLog.filter((r) => r.id !== id);
    localStorage.setItem(RUN_LOG_KEY, JSON.stringify(next));
    setRunLog(next);
  }

  function handleSaveRoutine(routine) {
    const next = [...routines, { id: `${Date.now()}`, name: routine.name, exercises: routine.exercises, isCircuit: !!routine.isCircuit }];
    localStorage.setItem(ROUTINES_KEY, JSON.stringify(next));
    setRoutines(next);
    setMode("idle");
  }

  function handleDeleteRoutine(id) {
    const next = routines.filter((r) => r.id !== id);
    localStorage.setItem(ROUTINES_KEY, JSON.stringify(next));
    setRoutines(next);
  }

  function startRoutine(routine) {
    setRoutineQueue(routine.exercises);
    setRoutineIndex(0);
    setRoutineName(routine.name);
    setIsCircuitActive(!!routine.isCircuit);
    setRoundCount(1);
    setPendingExercise(routine.exercises[0]);
    setMode("logging");
  }

  function cancelRoutine() {
    setRoutineQueue(null);
    setRoutineIndex(0);
    setIsCircuitActive(false);
    setRoundCount(1);
    setPendingExercise(null);
    setMode("idle");
  }

  function continueNextRound() {
    setRoundCount((r) => r + 1);
    setRoutineIndex(0);
    setPendingExercise(routineQueue[0]);
    setMode("logging");
  }

  function skipRoutineExercise() {
    const nextIndex = routineIndex + 1;
    if (routineQueue && nextIndex < routineQueue.length) {
      setRoutineIndex(nextIndex);
      setPendingExercise(routineQueue[nextIndex]);
    } else if (isCircuitActive) {
      setMode("circuit_round_end");
    } else {
      cancelRoutine();
    }
  }

  function handleSaveGoal(exerciseName, weight, reps) {
    const next = { ...goals, [exerciseName]: { weight, reps, updatedAt: todayStr() } };
    localStorage.setItem(GOALS_KEY, JSON.stringify(next));
    setGoals(next);
  }

  function handleDeleteGoal(exerciseName) {
    const next = { ...goals };
    delete next[exerciseName];
    localStorage.setItem(GOALS_KEY, JSON.stringify(next));
    setGoals(next);
  }

  function handleSaveNote(exerciseName, text) {
    const next = { ...notes };
    if (text) {
      next[exerciseName] = text;
    } else {
      delete next[exerciseName];
    }
    localStorage.setItem(NOTES_KEY, JSON.stringify(next));
    setNotes(next);
  }

  function persist(next) {
    localStorage.setItem(ENTRIES_KEY, JSON.stringify(next));
    setEntries(next);
  }

  function handleAddCustomExercise(categoryKey, name, isBodyweight) {
    const nextCustom = {
      ...customExercises,
      [categoryKey]: [...(customExercises[categoryKey] || []), name],
    };
    localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(nextCustom));
    setCustomExercises(nextCustom);

    if (isBodyweight) {
      const nextBW = [...customBodyweightNames, name];
      localStorage.setItem(CUSTOM_BW_KEY, JSON.stringify(nextBW));
      setCustomBodyweightNames(nextBW);
    }
  }

  function handleDeleteCustomExercise(categoryKey, name) {
    const nextCustom = {
      ...customExercises,
      [categoryKey]: (customExercises[categoryKey] || []).filter((n) => n !== name),
    };
    localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(nextCustom));
    setCustomExercises(nextCustom);

    if (customBodyweightNames.includes(name)) {
      const nextBW = customBodyweightNames.filter((n) => n !== name);
      localStorage.setItem(CUSTOM_BW_KEY, JSON.stringify(nextBW));
      setCustomBodyweightNames(nextBW);
    }
  }

  function handleToggleFavorite(name) {
    const next = favorites.includes(name) ? favorites.filter((n) => n !== name) : [...favorites, name];
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(next));
    setFavorites(next);
  }

  function startEditEntry(entry) {
    setEditingEntry(entry);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelEditEntry() {
    setEditingEntry(null);
  }

  function handleSaveEditedSets(sets, newDate) {
    const next = entries.map((e) => (e.id === editingEntry.id ? { ...e, sets, date: newDate || e.date } : e));
    persist(next);
    setEditingEntry(null);
  }

  function handleDuplicateEntry(sourceEntry) {
    const entry = {
      id: `${Date.now()}`,
      date: logDate,
      exerciseName: sourceEntry.exerciseName,
      category: sourceEntry.category,
      sets: sourceEntry.sets.map((s) => ({ ...s })),
    };
    persist([entry, ...entries]);
  }

  function handleSelectExercise(name, category) {
    setPendingExercise({ name, category });
    setMode("logging");
  }

  function handleSaveSets(sets) {
    const entry = {
      id: `${Date.now()}`,
      date: logDate,
      exerciseName: pendingExercise.name,
      category: pendingExercise.category,
      sets,
    };
    persist([entry, ...entries]);

    if (routineQueue) {
      const nextIndex = routineIndex + 1;
      if (nextIndex < routineQueue.length) {
        setRoutineIndex(nextIndex);
        setPendingExercise(routineQueue[nextIndex]);
        return;
      }
      if (isCircuitActive) {
        setMode("circuit_round_end");
        return;
      }
      setRoutineQueue(null);
      setRoutineIndex(0);
    }
    setMode("idle");
    setPendingExercise(null);
  }

  function handleSetMachineDefault(name, val) {
    const next = { ...machineDefaults };
    const w = val.weight === undefined || val.weight === null ? "" : String(val.weight);
    if (w === "" && !val.memo) delete next[name];
    else next[name] = { weight: w, memo: val.memo || "" };
    localStorage.setItem(MACHINE_DEFAULTS_KEY, JSON.stringify(next));
    setMachineDefaults(next);
  }

  function handleDeleteEntry(id) {
    const index = entries.findIndex((e) => e.id === id);
    if (index < 0) return;
    const entry = entries[index];
    persist(entries.filter((e) => e.id !== id));
    setUndoDelete({ entry, index });
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setUndoDelete(null), 6000);
  }

  function handleUndoDelete() {
    if (!undoDelete) return;
    const next = [...entries];
    next.splice(Math.min(undoDelete.index, next.length), 0, undoDelete.entry);
    persist(next);
    setUndoDelete(null);
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
  }

  function handleAddMeal(date, meal) {
    const next = { ...nutrition, [date]: [...(nutrition[date] || []), meal] };
    localStorage.setItem(NUTRITION_KEY, JSON.stringify(next));
    setNutrition(next);
  }

  function handleDeleteMeal(date, id) {
    const rest = (nutrition[date] || []).filter((m) => m.id !== id);
    const next = { ...nutrition };
    if (rest.length) next[date] = rest; else delete next[date];
    localStorage.setItem(NUTRITION_KEY, JSON.stringify(next));
    setNutrition(next);
  }

  function handleSetNutritionGoal(g) {
    if (g === null) localStorage.removeItem(NUTRITION_GOAL_KEY);
    else localStorage.setItem(NUTRITION_GOAL_KEY, String(g));
    setNutritionGoal(g);
  }

  function handleStartSession() {
    const act = { startedAt: Date.now(), date: todayStr() };
    localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(act));
    setActiveSession(act);
  }

  function handleEndSession() {
    if (!activeSession) return;
    const minutes = Math.max(1, Math.round((Date.now() - activeSession.startedAt) / 60000));
    const prev = sessions[activeSession.date];
    const next = { ...sessions, [activeSession.date]: { minutes: (prev ? prev.minutes : 0) + minutes } };
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(next));
    localStorage.removeItem(ACTIVE_SESSION_KEY);
    setSessions(next);
    setActiveSession(null);
  }

  function handleCancelSession() {
    if (!window.confirm("計測を破棄しますか?(時間は保存されません)")) return;
    localStorage.removeItem(ACTIVE_SESSION_KEY);
    setActiveSession(null);
  }

  function markBackupDone() {
    const t = Date.now();
    localStorage.setItem(LAST_BACKUP_KEY, String(t));
    setLastBackupAt(t);
  }

  function buildBackupBlob() {
    const payload = {
      exportedAt: new Date().toISOString(),
      app: "workout-tracker",
      version: 1,
      entries,
      bodyWeightLog,
      runLog,
      routines,
      goals,
      notes,
      customExercises,
      customBodyweightNames,
      favorites,
      sessions,
      nutrition,
      nutritionGoal,
      machineDefaults,
    };
    return new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function handleExportData() {
    downloadBlob(buildBackupBlob(), `workout-backup-${todayStr().replace(/-/g, "")}.json`);
    markBackupDone();
  }

  // Backup via the native share sheet (Save to Files / iCloud Drive / LINE Keep ...).
  async function handleShareBackup() {
    const filename = `workout-backup-${todayStr().replace(/-/g, "")}.json`;
    const blob = buildBackupBlob();
    const file = new File([blob], filename, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "筋トレ記録のバックアップ" });
        markBackupDone();
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
    downloadBlob(blob, filename);
    markBackupDone();
  }

  function handleExportCsv() {
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [["日付", "種目", "セット", "重量(kg)", "回数", "自重", "補助(kg)"].map(esc).join(",")];
    [...entries]
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
      .forEach((e) => {
        e.sets.forEach((st, i) => {
          rows.push([e.date, e.exerciseName, i + 1, st.bodyweight ? "" : st.weight, st.reps, st.bodyweight ? "○" : "", st.assist > 0 ? st.assist : ""].map(esc).join(","));
        });
      });
    const blob = new Blob(["\uFEFF" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
    downloadBlob(blob, `workout-log-${todayStr().replace(/-/g, "")}.csv`);
  }

  function handleImportFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== "object") throw new Error("invalid");
        const ok = window.confirm("バックアップを読み込むと、現在のこの端末のデータは上書きされます。よろしいですか?");
        if (!ok) return;
        const nextEntries = Array.isArray(data.entries) ? data.entries : [];
        const nextBW = Array.isArray(data.bodyWeightLog) ? data.bodyWeightLog : [];
        const nextRunLog = Array.isArray(data.runLog) ? data.runLog : [];
        const nextRoutines = Array.isArray(data.routines) ? data.routines : [];
        const nextGoals = data.goals && typeof data.goals === "object" ? data.goals : {};
        const nextNotes = data.notes && typeof data.notes === "object" ? data.notes : {};
        const nextCustomEx = data.customExercises && typeof data.customExercises === "object" ? data.customExercises : {};
        const nextCustomBW = Array.isArray(data.customBodyweightNames) ? data.customBodyweightNames : [];
        const nextFavorites = Array.isArray(data.favorites) ? data.favorites : [];
        const nextSessions = data.sessions && typeof data.sessions === "object" && !Array.isArray(data.sessions) ? data.sessions : {};
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(nextSessions));
        setSessions(nextSessions);
        const nextNutrition = data.nutrition && typeof data.nutrition === "object" && !Array.isArray(data.nutrition) ? data.nutrition : {};
        localStorage.setItem(NUTRITION_KEY, JSON.stringify(nextNutrition));
        setNutrition(nextNutrition);
        const nextMD = data.machineDefaults && typeof data.machineDefaults === "object" && !Array.isArray(data.machineDefaults) ? data.machineDefaults : {};
        localStorage.setItem(MACHINE_DEFAULTS_KEY, JSON.stringify(nextMD));
        setMachineDefaults(nextMD);
        const nextGoal = typeof data.nutritionGoal === "number" ? data.nutritionGoal : null;
        if (nextGoal === null) localStorage.removeItem(NUTRITION_GOAL_KEY); else localStorage.setItem(NUTRITION_GOAL_KEY, String(nextGoal));
        setNutritionGoal(nextGoal);
        localStorage.setItem(ENTRIES_KEY, JSON.stringify(nextEntries));
        localStorage.setItem(BODYWEIGHT_LOG_KEY, JSON.stringify(nextBW));
        localStorage.setItem(RUN_LOG_KEY, JSON.stringify(nextRunLog));
        localStorage.setItem(ROUTINES_KEY, JSON.stringify(nextRoutines));
        localStorage.setItem(GOALS_KEY, JSON.stringify(nextGoals));
        localStorage.setItem(NOTES_KEY, JSON.stringify(nextNotes));
        localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(nextCustomEx));
        localStorage.setItem(CUSTOM_BW_KEY, JSON.stringify(nextCustomBW));
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(nextFavorites));
        setEntries(nextEntries);
        setBodyWeightLog(nextBW);
        setRunLog(nextRunLog);
        setRoutines(nextRoutines);
        setGoals(nextGoals);
        setNotes(nextNotes);
        setCustomExercises(nextCustomEx);
        setCustomBodyweightNames(nextCustomBW);
        setFavorites(nextFavorites);
        window.alert("バックアップを読み込みました。");
      } catch (e) {
        window.alert("ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。");
      }
    };
    reader.readAsText(file);
  }

  const selectedDateEntries = entries.filter((e) => e.date === logDate);
  const isLogToday = logDate === todayStr();
  const isLogYesterday = logDate === dateStrOffset(-1);
  const logDateLabel = isLogToday ? "今日" : isLogYesterday ? "昨日" : formatDateLabel(logDate);

  return (
    <div style={{
      fontFamily: "Inter, -apple-system, sans-serif", background: "#0A0A0A",
      minHeight: "100vh", color: "#F5F5F5", padding: "calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 96px)",
      maxWidth: 420, margin: "0 auto",
    }}>
      <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 700, fontSize: 24, margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.02em" }}>筋トレ記録</h1>
      <p style={{ color: "#A8A8A8", fontSize: 13, margin: "0 0 18px" }}>
        {loading ? "読み込み中..." : `${logDateLabel}は ${selectedDateEntries.length} 種目トレーニング済み`}
      </p>

      {SUB_TABS.includes(tab) && (
        <button
          onClick={() => setTab(tab === "machines" ? "home" : "menu")}
          style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 13, cursor: "pointer", padding: "0 0 12px", display: "flex", alignItems: "center", gap: 4 }}
        >
          ‹ {tab === "machines" ? "ホーム" : "メニュー"} <span style={{ color: "#F5F5F5", fontWeight: 700, marginLeft: 4 }}>{SUB_TAB_LABELS[tab]}</span>
        </button>
      )}

      {editingEntry && (
        <EditSetsForm
          entry={editingEntry}
          onSave={handleSaveEditedSets}
          onCancel={cancelEditEntry}
          customBodyweightNames={customBodyweightNames}
        />
      )}

      {tab === "today" && (
        <>
          {!loading && mode === "idle" && (
            <div style={{ display: "flex", gap: 6, marginBottom: 14, alignItems: "center" }}>
              <button
                onClick={() => setLogDate(todayStr())}
                style={{
                  flexShrink: 0, fontSize: 12, padding: "7px 14px", borderRadius: 999,
                  border: isLogToday ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: isLogToday ? "rgba(232,53,43,0.12)" : "transparent",
                  color: isLogToday ? ACCENT : "#A8A8A8", fontWeight: 700, cursor: "pointer",
                  fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
                }}
              >
                今日
              </button>
              <button
                onClick={() => setLogDate(dateStrOffset(-1))}
                style={{
                  flexShrink: 0, fontSize: 12, padding: "7px 14px", borderRadius: 999,
                  border: isLogYesterday ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: isLogYesterday ? "rgba(232,53,43,0.12)" : "transparent",
                  color: isLogYesterday ? ACCENT : "#A8A8A8", fontWeight: 700, cursor: "pointer",
                  fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
                }}
              >
                昨日
              </button>
              <input
                type="date"
                value={logDate}
                max={todayStr()}
                onChange={(e) => e.target.value && setLogDate(e.target.value)}
                style={{
                  flex: 1, padding: "7px 10px", borderRadius: 999, border: !isLogToday && !isLogYesterday ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: !isLogToday && !isLogYesterday ? "rgba(232,53,43,0.12)" : "#161616",
                  color: !isLogToday && !isLogYesterday ? ACCENT : "#A8A8A8", fontSize: 12, fontWeight: 600, colorScheme: "dark",
                }}
              />
            </div>
          )}

          {!loading && mode === "idle" && isLogToday && (
            <SessionCard
              active={activeSession}
              savedMinutes={(sessions[todayStr()] || {}).minutes || 0}
              onStart={handleStartSession}
              onEnd={handleEndSession}
              onCancel={handleCancelSession}
            />
          )}

          {!loading && !isLogToday && (
            <p style={{ fontSize: 11, color: "#A8A8A8", background: "rgba(232,53,43,0.08)", border: `1px solid ${ACCENT}`, borderRadius: 10, padding: "8px 12px", margin: "-6px 0 14px" }}>
              📅 {logDateLabel}の記録として保存されます
            </p>
          )}

          {mode === "idle" && (
            <button
              onClick={() => setMode("picking")}
              style={{
                width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                background: ACCENT, color: "#fff", fontSize: 14, fontWeight: 700,
                cursor: "pointer", marginBottom: 14, fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
              }}
            >
              + 種目を記録
            </button>
          )}

          {!loading && selectedDateEntries.length === 0 && mode === "idle" && (
            <div style={{ textAlign: "center", padding: "10px 0 14px", color: "#7A7A7A" }}>
              <p style={{ fontSize: 13, margin: 0 }}>{isLogToday ? "今日はまだ記録がありません" : `${logDateLabel}の記録はまだありません`}</p>
            </div>
          )}

          {!loading && selectedDateEntries.map((e) => (
            <div key={e.id} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                <p style={{ margin: 0, fontSize: 14, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>{e.exerciseName}</p>
                <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
                  <button onClick={() => startEditEntry(e)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
                  <button onClick={() => handleDeleteEntry(e.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
                </div>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {e.sets.map((s, i) => (
                  <span key={i} style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                    {setLabel(s)} × {s.reps}回
                  </span>
                ))}
              </div>
            </div>
          ))}

          {!loading && mode === "idle" && (
            <ShareDayButton
              dateLabel={logDateLabel}
              dayEntries={selectedDateEntries}
              dayRuns={runLog.filter((r) => r.date === logDate)}
              minutes={(sessions[logDate] || {}).minutes || 0}
            />
          )}

          {!loading && mode === "idle" && <div style={{ height: 6 }} />}

          {!loading && mode === "idle" && (
            <RecentExercises entries={entries} onDuplicate={handleDuplicateEntry} />
          )}

          {!loading && mode === "idle" && (
            <MyRoutines
              routines={routines}
              onStart={startRoutine}
              onCreateNew={() => setMode("routine_building")}
              onDelete={handleDeleteRoutine}
            />
          )}

          {mode === "picking" && (
            <ExercisePicker
              entries={entries}
              onSelect={handleSelectExercise}
              onClose={() => setMode("idle")}
              customExercises={customExercises}
              onAddCustom={handleAddCustomExercise}
              onDeleteCustom={handleDeleteCustomExercise}
              favorites={favorites}
              onToggleFavorite={handleToggleFavorite}
            />
          )}

          {mode === "routine_building" && (
            <RoutineBuilder onSave={handleSaveRoutine} onCancel={() => setMode("idle")} customExercises={customExercises} />
          )}

          {mode === "logging" && pendingExercise && (
            <SetPicker
              key={`${pendingExercise.name}-${routineIndex}-${roundCount}`}
              exerciseName={pendingExercise.name}
              entries={entries}
              note={notes[pendingExercise.name]}
              onSaveNote={handleSaveNote}
              routineInfo={routineQueue ? { name: `${routineName}${isCircuitActive ? ` ${roundCount}周目` : ""}`, index: routineIndex, total: routineQueue.length } : null}
              suppressTimer={isCircuitActive}
              onSkip={routineQueue ? skipRoutineExercise : null}
              onCancel={() => { routineQueue ? cancelRoutine() : (setMode("idle"), setPendingExercise(null)); }}
              onSave={handleSaveSets}
              customBodyweightNames={customBodyweightNames}
              machineDefault={machineDefaults[pendingExercise.name]}
            />
          )}

          {mode === "circuit_round_end" && (
            <div style={{ background: "#161616", border: `1px solid ${ACCENT}`, borderRadius: 16, padding: "18px", marginTop: 8, textAlign: "center" }}>
              <p style={{ fontSize: 15, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", margin: "0 0 4px", textTransform: "uppercase" }}>
                {roundCount}周 完了！
              </p>
              <p style={{ fontSize: 12, color: "#A8A8A8", margin: "0 0 14px" }}>{routineName}</p>
              <RestTimer />
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={cancelRoutine}
                  style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
                >
                  終了
                </button>
                <button
                  onClick={continueNextRound}
                  style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "none", background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
                >
                  もう1周
                </button>
              </div>
            </div>
          )}
        </>
      )}

      {tab === "menu" && !loading && <MenuTab onSelect={setTab} />}

      {tab === "home" && !loading && (
        <HomeTab
          entries={entries} runLog={runLog} sessions={sessions} lastBackupAt={lastBackupAt} onBackupNow={handleShareBackup}
          onOpenMachines={() => { setTab("machines"); window.scrollTo(0, 0); }}
          machineCount={Object.keys(machineDefaults).length}
        />
      )}

      {tab === "machines" && !loading && (
        <MachineSettingsTab defaults={machineDefaults} onChange={handleSetMachineDefault} customExercises={customExercises} />
      )}

      {tab === "history" && !loading && (
        <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px" }}>
          <CalendarView entries={entries} onDeleteEntry={handleDeleteEntry} onEditEntry={startEditEntry} sessions={sessions} />
        </div>
      )}

      {tab === "analysis" && !loading && (
        <AnalyticsHub entries={entries} runLog={runLog} />
      )}

      {tab === "cardio" && !loading && (
        <RunTab runLog={runLog} onAdd={handleAddRun} onUpdate={handleUpdateRun} onDelete={handleDeleteRun} />
      )}

      {tab === "bodyweight" && !loading && (
        <BodyWeightTab log={bodyWeightLog} onAdd={handleAddBodyWeight} onDelete={handleDeleteBodyWeight} />
      )}

      {tab === "nutrition" && !loading && (
        <NutritionTab
          log={nutrition} goal={nutritionGoal} bodyWeightLog={bodyWeightLog}
          onAddMeal={handleAddMeal} onDeleteMeal={handleDeleteMeal} onSetGoal={handleSetNutritionGoal}
        />
      )}

      {tab === "goals" && !loading && (
        <GoalsTab entries={entries} goals={goals} onSave={handleSaveGoal} onDelete={handleDeleteGoal} customExercises={customExercises} />
      )}

      {tab === "menu" && !loading && (<>
        <BackupSection onExport={handleExportData} onShare={handleShareBackup} onExportCsv={handleExportCsv} lastBackupAt={lastBackupAt} onImportFile={handleImportFile} />
        <p style={{ fontSize: 11, color: "#6B6B6B", marginTop: 24, textAlign: "center" }}>データはこの端末(ブラウザ)にのみ保存されます。{storageProtected === true ? " (消去から保護済み)" : ""}</p>
      </>)}

      {undoDelete && (
        <div style={{ position: "fixed", left: 16, right: 16, bottom: "calc(env(safe-area-inset-bottom) + 74px)", zIndex: 60, maxWidth: 520, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "#262626", border: "1px solid #444", borderRadius: 12, padding: "10px 12px 10px 14px", boxShadow: "0 6px 20px rgba(0,0,0,0.5)" }}>
          <span style={{ fontSize: 13, color: "#F5F5F5", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>「{undoDelete.entry.exerciseName}」を削除しました</span>
          <button onClick={handleUndoDelete} style={{ flexShrink: 0, background: "transparent", border: "none", color: ACCENT, fontSize: 13, fontWeight: 700, cursor: "pointer", padding: "6px 8px" }}>元に戻す</button>
        </div>
      )}
      <BottomNav tab={tab} onChange={(k) => { setTab(k); window.scrollTo(0, 0); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkoutTracker />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
