function getCategoryExercises(category, customExercises) {
  const custom = (customExercises && customExercises[category.key]) || [];
  return [...category.exercises, ...custom];
}

// Local-calendar "YYYY-MM-DD" (toISOString() would shift the date by the UTC offset, e.g. JST).
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function todayStr() {
  return localDateStr(new Date());
}

function dateStrOffset(offsetDays) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return localDateStr(d);
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function WeightInput({ value, onChange, placeholder }) {
  const bump = (d) => {
    const cur = parseFloat(value);
    const next = Math.max(0, (isNaN(cur) ? 0 : cur) + d);
    onChange(String(Math.round(next * 100) / 100));
  };
  const btn = { flexShrink: 0, width: 34, border: "1px solid #363636", background: "#0A0A0A", color: "#D6D6D6", fontSize: 20, fontWeight: 500, lineHeight: 1, cursor: "pointer", padding: 0 };
  return (
    <div style={{ display: "flex", flex: 1.3, minWidth: 0 }}>
      <button type="button" onClick={() => bump(-2.5)} aria-label="2.5kg減らす" style={{ ...btn, borderRadius: "8px 0 0 8px" }}>-</button>
      <input
        type="number" inputMode="decimal" placeholder={placeholder || "重量kg"} value={value}
        onChange={(e) => onChange(e.target.value)}
        style={{ flex: 1, minWidth: 0, width: "100%", padding: "9px 4px", border: "1px solid #363636", borderLeft: "none", borderRight: "none", background: "#161616", color: "#F5F5F5", fontSize: 14, textAlign: "center" }}
      />
      <button type="button" onClick={() => bump(2.5)} aria-label="2.5kg増やす" style={{ ...btn, borderRadius: "0 8px 8px 0" }}>+</button>
    </div>
  );
}

function RestTimer() {
  const PRESETS = [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 210, 240, 270, 300];
  const [duration, setDuration] = useState(90);
  const [remaining, setRemaining] = useState(90);
  const [running, setRunning] = useState(false);
  const [justFinished, setJustFinished] = useState(false);
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );

  const endAtRef = useRef(null);
  const notifTimeoutRef = useRef(null);

  function clearNotifTimeout() {
    if (notifTimeoutRef.current) {
      clearTimeout(notifTimeoutRef.current);
      notifTimeoutRef.current = null;
    }
  }

  function fireNotification() {
    if (notifPermission !== "granted") return;
    const opts = {
      body: "次のセットを始めましょう💪",
      icon: "./icon-192.png",
      badge: "./icon-192.png",
      vibrate: [250, 120, 250, 120, 250],
      tag: "rest-timer",
      renotify: true,
    };
    const show = (reg) => {
      if (reg && reg.showNotification) {
        reg.showNotification("⏱ 休憩終了！", opts);
      } else {
        try { new Notification("⏱ 休憩終了！", opts); } catch (e) {}
      }
    };
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(show).catch(() => show(null));
    } else {
      show(null);
    }
  }

  function scheduleNotification(seconds) {
    clearNotifTimeout();
    if (notifPermission !== "granted") return;
    notifTimeoutRef.current = setTimeout(fireNotification, seconds * 1000);
  }

  async function requestNotifPermission() {
    if (typeof Notification === "undefined") return;
    try {
      const perm = await Notification.requestPermission();
      setNotifPermission(perm);
    } catch (e) {}
  }

  useEffect(() => {
    if (!running) return;
    const tick = () => {
      const left = Math.max(0, Math.round((endAtRef.current - Date.now()) / 1000));
      setRemaining(left);
      if (left <= 0) {
        setRunning(false);
        setJustFinished(true);
        if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]);
      }
    };
    tick();
    const id = setInterval(tick, 1000);
    const onVisible = () => { if (document.visibilityState === "visible") tick(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, [running]);

  useEffect(() => () => clearNotifTimeout(), []);

  function selectDuration(sec) {
    setDuration(sec);
    setRemaining(sec);
    setRunning(false);
    setJustFinished(false);
    clearNotifTimeout();
  }

  function toggle() {
    setJustFinished(false);
    if (remaining <= 0) {
      endAtRef.current = Date.now() + duration * 1000;
      setRemaining(duration);
      setRunning(true);
      scheduleNotification(duration);
    } else if (running) {
      setRunning(false);
      clearNotifTimeout();
    } else {
      endAtRef.current = Date.now() + remaining * 1000;
      setRunning(true);
      scheduleNotification(remaining);
    }
  }

  function reset() {
    setRunning(false);
    setJustFinished(false);
    setRemaining(duration);
    clearNotifTimeout();
  }

  function labelFor(sec) {
    if (sec < 60) return `${sec}秒`;
    return sec % 60 === 0 ? `${sec / 60}分` : `${Math.floor(sec / 60)}分${sec % 60}秒`;
  }

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");
  const pct = duration > 0 ? (remaining / duration) * 100 : 0;

  return (
    <div
      className={justFinished ? "timer-alert-box" : ""}
      style={{
        background: "#0A0A0A", border: justFinished ? `2px solid ${ACCENT}` : running ? `1px solid ${ACCENT}` : "1px solid #363636",
        borderRadius: 14, padding: "16px 16px 14px", marginBottom: 14,
      }}
    >
      <p style={{
        fontSize: 11, fontWeight: 700, margin: "0 0 12px", color: justFinished ? ACCENT : "#A8A8A8",
        fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.06em", textAlign: "center",
      }}>
        {justFinished ? "🔔 休憩終了！次のセットへ" : "休憩タイマー"}
      </p>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 14 }}>
        <span
          className={justFinished ? "timer-alert-text" : ""}
          style={{
            fontSize: 44, fontWeight: 700, color: justFinished ? ACCENT : "#F5F5F5",
            fontFamily: "'Oswald', sans-serif", lineHeight: 1, letterSpacing: "0.02em",
          }}
        >
          {mm}:{ss}
        </span>
        <div style={{ width: "100%", height: 6, background: "#242424", borderRadius: 999, overflow: "hidden", marginTop: 12 }}>
          <div style={{ height: "100%", width: `${pct}%`, background: ACCENT, borderRadius: 999, transition: "width 1s linear" }} />
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4, marginBottom: 14 }}>
        {PRESETS.map((sec) => (
          <button
            key={sec}
            onClick={() => selectDuration(sec)}
            style={{
              flexShrink: 0, fontSize: 11, padding: "5px 11px", borderRadius: 999,
              border: duration === sec ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: duration === sec ? "rgba(232,53,43,0.14)" : "transparent",
              color: duration === sec ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
            }}
          >
            {labelFor(sec)}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, justifyContent: "center", alignItems: "center", marginBottom: 10 }}>
        <button
          onClick={toggle}
          style={{
            flex: 1, maxWidth: 220, padding: "12px 0", borderRadius: 10, border: "none",
            background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer",
            fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.03em",
          }}
        >
          {running ? "一時停止" : remaining <= 0 ? "開始" : "再開"}
        </button>
        <button
          onClick={reset}
          style={{
            padding: "12px 16px", borderRadius: 10, border: "1px solid #363636", background: "transparent",
            color: "#A8A8A8", fontSize: 12, fontWeight: 600, cursor: "pointer",
          }}
        >
          リセット
        </button>
      </div>

      {notifPermission !== "granted" && notifPermission !== "unsupported" && (
        <button
          onClick={requestNotifPermission}
          style={{
            width: "100%", padding: "9px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent",
            color: "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer",
          }}
        >
          🔔 終了を通知で知らせる
        </button>
      )}
      {notifPermission === "granted" && (
        <p style={{ fontSize: 10, color: "#7A7A7A", margin: 0, textAlign: "center" }}>
          🔔 通知と振動で休憩終了をお知らせします
        </p>
      )}
      {notifPermission === "denied" && (
        <p style={{ fontSize: 10, color: "#7A7A7A", margin: 0 }}>
          通知がブロックされています。端末の設定アプリからこのアプリの通知を許可してください。
        </p>
      )}
    </div>
  );
}

  if (s.bodyweight) return s.assist > 0 ? `補助${s.assist}kg` : "自重";
  return `${s.weight}kg`;
}
function supportsAssistName(name) {
  return /懸垂|チンニング|プルアップ|ディップス/.test(name || "");
}

const EQUIPMENTS = [
  { key: "dumbbell", label: "ダンベル", color: "#E8A33B" },
  { key: "barbell", label: "バーベル", color: "#5BA8E8" },
  { key: "machine", label: "マシン", color: "#8A7BE8" },
  { key: "cable", label: "ケーブル", color: "#4CC38A" },
  { key: "bodyweight", label: "自重", color: "#C9C9C9" },
  { key: "other", label: "その他", color: "#7A7A7A" },
];
const EQUIP_BY_NAME = {
  dumbbell: ["サイドレイズ","フロントレイズ","リアレイズ","アーノルドプレス","ハンマーカール","インクラインカール","コンセントレーションカール","ゴブレットスクワット","ベントオーバーダンベルリアレイズ","インクラインダンベルリアレイズ","ダンベルラテラルレイズ(片手サポート)","チェストサポートダンベルロウ","ダンベルローイング(片腕)","ベントオーバーダンベルリアレイズ"],
  barbell: ["ベンチプレス","インクラインベンチプレス","デクラインベンチプレス","デッドリフト","ベントオーバーロウ","Tバーロウ","シュラッグ","アップライトロウ","ルーマニアンデッドリフト","スティッフレッグドデッドリフト","スモウデッドリフト","ライイングトライセプスエクステンション","オーバーヘッドトライセプスエクステンション","ヒップスラスト","プルオーバー","リストカール","リバースリストカール","インクラインカール_"],
  machine: ["ラットプルダウン","ワンハンドラットプルダウン","リバースグリップラットプルダウン","シーテッドローイング","レッグプレス","レッグカール","レッグエクステンション","ハックスクワット","カーフレイズ_","チェストプレスマシン","ペックフライマシン","マシンショルダープレス","ヒップアブダクション(マシン)","グルートキックバック(マシン)"],
  cable: ["フェイスプル","プレスダウン","ストレートアームプルダウン"],
};
function getEquipment(name) {
  for (const k of ["dumbbell", "barbell", "machine", "cable"]) if (EQUIP_BY_NAME[k].includes(name)) return k;
  if (name.includes("ケーブル")) return "cable";
  if (name.includes("スミスマシン") || name.includes("マシン")) return "machine";
  if (name.includes("ダンベル")) return "dumbbell";
  if (name.includes("バーベル")) return "barbell";
  if (BODYWEIGHT_EXERCISES.has(name)) return "bodyweight";
  return "other";
}
function EquipTag({ name }) {
  const e = EQUIPMENTS.find((x) => x.key === getEquipment(name));
  return (
    <span style={{ fontSize: 10, fontWeight: 700, color: e.color, border: `1px solid ${e.color}55`, borderRadius: 999, padding: "1px 7px", flexShrink: 0, whiteSpace: "nowrap" }}>
      {e.label}
    </span>
  );
}

// Progressive-overload suggestion based on the most recent session of an exercise.
// Returns { label, sets: [{weight, reps, bodyweight}] } or null.
function computeOverloadSuggestion(lastEntry) {
  if (!lastEntry || !lastEntry.sets || lastEntry.sets.length === 0) return null;
  const weighted = lastEntry.sets.filter((s) => !s.bodyweight);
  const count = lastEntry.sets.length;
  if (weighted.length === 0 && lastEntry.sets.some((s) => s.assist > 0)) {
    const assisted = lastEntry.sets.filter((s) => s.assist > 0);
    const minAssist = Math.min(...assisted.map((s) => s.assist));
    const topReps = Math.max(...assisted.filter((s) => s.assist === minAssist).map((s) => s.reps));
    if (topReps >= 10) {
      const nextA = Math.max(0, Math.round((minAssist - 2.5) * 10) / 10);
      return {
        label: nextA > 0 ? `10回達成！ 補助${nextA}kg × 8回に挑戦` : "10回達成！ 補助なし(自重)に挑戦",
        sets: Array.from({ length: count }, () => (nextA > 0 ? { weight: "", reps: "8", bodyweight: true, assist: String(nextA) } : { weight: "", reps: "8", bodyweight: true })),
      };
    }
    return {
      label: `補助${minAssist}kg × ${topReps + 1}回 (あと1回)`,
      sets: Array.from({ length: count }, () => ({ weight: "", reps: String(topReps + 1), bodyweight: true, assist: String(minAssist) })),
    };
  }
  if (weighted.length === 0) {
    const maxReps = Math.max(...lastEntry.sets.map((s) => s.reps));
    return {
      label: `自重で${maxReps + 1}回を目指そう`,
      sets: Array.from({ length: count }, () => ({ weight: "", reps: String(maxReps + 1), bodyweight: true })),
    };
  }
  const top = weighted.reduce((best, s) => (s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps) ? s : best), weighted[0]);
  const allHitTarget = weighted.every((s) => s.weight < top.weight || s.reps >= 10);
  if (top.reps >= 10 && allHitTarget) {
    const nextW = Math.round((top.weight + 2.5) * 10) / 10;
    return {
      label: `10回達成！ ${nextW}kg × 8回に挑戦`,
      sets: Array.from({ length: count }, () => ({ weight: String(nextW), reps: "8", bodyweight: false })),
    };
  }
  return {
    label: `${top.weight}kg × ${top.reps + 1}回 (あと1回)`,
    sets: Array.from({ length: count }, () => ({ weight: String(top.weight), reps: String(top.reps + 1), bodyweight: false })),
  };
}

function PlateCalculator({ initialWeight }) {
  const [open, setOpen] = useState(false);
  const [target, setTarget] = useState("");
  const [bar, setBar] = useState(20);
  const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];

  function toggle() {
    if (!open && !target && initialWeight) setTarget(String(initialWeight));
    setOpen((v) => !v);
  }

  const t = parseFloat(target);
  let perSide = null;
  let remainder = 0;
  if (!isNaN(t) && t > bar) {
    let left = (t - bar) / 2;
    perSide = [];
    PLATES.forEach((p) => {
      const n = Math.floor((left + 1e-9) / p);
      if (n > 0) { perSide.push({ plate: p, n }); left -= n * p; }
    });
    remainder = Math.round(left * 2 * 100) / 100;
  }

  return (
    <div style={{ marginBottom: 12 }}>
      <button
        onClick={toggle}
        style={{
          width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px dashed #4A4A4A", background: "transparent",
          color: "#A8A8A8", fontSize: 12, cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between",
        }}
      >
        <span>🏋️ プレート計算(バーベル用)</span>
        <span>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 12px", marginTop: 6 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              type="number" inputMode="decimal" placeholder="目標重量kg" value={target}
              onChange={(e) => setTarget(e.target.value)}
              style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13 }}
            />
            <div style={{ display: "flex", borderRadius: 8, border: "1px solid #363636", overflow: "hidden" }}>
              {[20, 15, 10].map((b) => (
                <button
                  key={b}
                  onClick={() => setBar(b)}
                  style={{
                    padding: "0 10px", border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700,
                    background: bar === b ? ACCENT : "transparent", color: bar === b ? "#fff" : "#A8A8A8",
                  }}
                >
                  バー{b}kg
                </button>
              ))}
            </div>
          </div>
          {perSide === null ? (
            <p style={{ margin: 0, fontSize: 11, color: "#7A7A7A" }}>バーより重い目標重量を入力してください</p>
          ) : perSide.length === 0 ? (
            <p style={{ margin: 0, fontSize: 11, color: "#7A7A7A" }}>プレートの追加なし(バーのみ+{remainder}kg不足)</p>
          ) : (
            <>
              <p style={{ margin: "0 0 6px", fontSize: 11, color: "#A8A8A8" }}>片側につけるプレート:</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {perSide.map((x) => (
                  <span key={x.plate} style={{ fontSize: 13, fontWeight: 700, color: "#F5F5F5", background: "#161616", border: `1px solid ${ACCENT}`, borderRadius: 8, padding: "5px 10px", fontFamily: "'Oswald', sans-serif" }}>
                    {x.plate}kg × {x.n}
                  </span>
                ))}
              </div>
              {remainder > 0 && (
                <p style={{ margin: "8px 0 0", fontSize: 11, color: "#7A7A7A" }}>※ 手持ちのプレートでは{remainder}kg不足します(最小1.25kg)</p>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function LastRecordPanel({ lastEntry, onApply, onApplySuggestion }) {
  const suggestion = computeOverloadSuggestion(lastEntry);
  const weighted = lastEntry.sets.filter((s) => !s.bodyweight);
  const best1rm = weighted.length ? Math.max(...weighted.map((s) => estimated1RM(s.weight, s.reps))) : null;

        前回 ({formatDateLabel(lastEntry.date)})

            color: ACCENT, fontSize: 12, fontWeight: 700, cursor: "pointer", textAlign: "left",

function SetRowInputs({ s, idx, supportsBodyweight, supportsAssist, updateSet, setMode }) {

function SetPicker({ exerciseName, entries, routineInfo, note, onSaveNote, suppressTimer, onCancel, onSkip, onSave, customBodyweightNames, machineDefault }) {
  const hasPast = entries.some((e) => e.exerciseName === exerciseName);
  const defWeight = machineDefault && machineDefault.weight !== "" && machineDefault.weight !== undefined ? String(machineDefault.weight) : "";
  const [sets, setSets] = useState([{ weight: !hasPast ? defWeight : "", reps: "", bodyweight: false }]);
  const [error, setError] = useState("");
  const [noteEditing, setNoteEditing] = useState(false);
  const [noteDraft, setNoteDraft] = useState(note || "");
  const rootRef = useRef(null);
  const [timerOpen, setTimerOpen] = useState(false);
  useEffect(() => {
    if (rootRef.current) rootRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);
  const supportsBodyweight = BODYWEIGHT_EXERCISES.has(exerciseName) || (customBodyweightNames || []).includes(exerciseName);
  const supportsAssist = supportsAssistName(exerciseName);

  function handleSaveNote() {
    onSaveNote(exerciseName, noteDraft.trim());
    setNoteEditing(false);
  }

  const lastEntry = useMemo(() => {
    const past = entries
      .filter((e) => e.exerciseName === exerciseName)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1)));
    return past[0] || null;
  }, [entries, exerciseName]);

  function applyLastEntry() {
    setSets(lastEntry.sets.map((s) => ({
      weight: s.bodyweight ? "" : String(s.weight),
      reps: String(s.reps),
      bodyweight: !!s.bodyweight,
      ...(s.bodyweight && s.assist > 0 ? { assist: String(s.assist) } : {}),
    })));
  }

  function applySuggestion(suggestion) {
    setSets(suggestion.sets);
  }

  function updateSet(idx, field, value) {
    const next = sets.map((s, i) => (i === idx ? { ...s, [field]: value } : s));
    setSets(next);
  }

  function setMode(idx, mode) {
    const next = sets.map((s, i) => {
      if (i !== idx) return s;
      const { assist, ...rest } = s;
      if (mode === "weight") return { ...rest, bodyweight: false, weight: "" };
      if (mode === "bw") return { ...rest, bodyweight: true, weight: "" };
      return { ...rest, bodyweight: true, weight: "", assist: "" };
    });
    setSets(next);
  }

  function addSetRow() {
    const last = sets[sets.length - 1];
    setSets([...sets, { weight: last ? last.weight : "", reps: last ? last.reps : "", bodyweight: last?.bodyweight || false, ...(last && last.assist !== undefined ? { assist: last.assist } : {}) }]);
  }

  function removeSetRow(idx) {
    setSets(sets.filter((_, i) => i !== idx));
  }

  function handleSave() {
    const parsed = sets
      .map((s) => {
        const a = parseFloat(s.assist);
        return {
          weight: s.bodyweight ? 0 : parseFloat(s.weight),
          reps: parseInt(s.reps, 10),
          bodyweight: !!s.bodyweight,
          ...(s.bodyweight && a > 0 ? { assist: a } : {}),
        };
      })
      .filter((s) => !isNaN(s.reps) && s.reps > 0 && (s.bodyweight || (!isNaN(s.weight) && s.weight > 0)));
    if (parsed.length === 0) {
      setError("重量(または自重)と回数を1セット以上入力してください");
      return;
    }
    onSave(parsed);
  }

  return (
    <div ref={rootRef} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginTop: 8, scrollMarginTop: 8 }}>
      {machineDefault && (machineDefault.weight !== "" || machineDefault.memo) && (
        <button
          onClick={() => defWeight && setSets(sets.map((x) => (x.bodyweight || x.weight !== "" ? x : { ...x, weight: defWeight })))}
          style={{ display: "block", width: "100%", textAlign: "left", marginBottom: 10, padding: "8px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A", color: "#D6D6D6", fontSize: 12, cursor: defWeight ? "pointer" : "default" }}
        >
          ⚙ 初期設定: <b>{defWeight ? `${defWeight}kg` : "—"}</b>{machineDefault.memo ? ` ・${machineDefault.memo}` : ""}
          {defWeight && <span style={{ color: "#7A7A7A", marginLeft: 6 }}>タップで空欄に入力</span>}
        </button>
      )}
      {routineInfo && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ fontSize: 11, color: ACCENT, fontWeight: 700, background: "rgba(232,53,43,0.12)", border: `1px solid ${ACCENT}`, borderRadius: 999, padding: "3px 10px" }}>
            {routineInfo.name} {routineInfo.index + 1}/{routineInfo.total}
          </span>
          {onSkip && (
            <button onClick={onSkip} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>次の種目へスキップ</button>
          )}
        </div>
      )}
      <p style={{ fontSize: 15, fontWeight: 700, margin: "0 0 14px", color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase", letterSpacing: "0.02em" }}>
        {exerciseName}
      </p>

      {noteEditing ? (
        <div style={{ marginBottom: 12 }}>
          <textarea
            value={noteDraft}
            onChange={(e) => setNoteDraft(e.target.value)}
            placeholder="フォームのコツや注意点をメモ(例: 肩甲骨を寄せる、膝がつま先より前に出ないように)"
            rows={3}
            style={{
              width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636",
              background: "#0A0A0A", color: "#F5F5F5", fontSize: 12, resize: "vertical", marginBottom: 8,
            }}
          />
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => { setNoteDraft(note || ""); setNoteEditing(false); }}
              style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 11, fontWeight: 600, cursor: "pointer" }}
            >
              キャンセル

            <button
              onClick={handleSaveNote}
              style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
            >
              メモを保存

        <div style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
            <p style={{ fontSize: 12, color: "#D6D6D6", margin: 0, whiteSpace: "pre-wrap", lineHeight: 1.5 }}>📝 {note}</p>
            <button onClick={() => setNoteEditing(true)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer", flexShrink: 0 }}>編集</button>
          </div>
        </div>
      ) : (
        <button
          onClick={() => setNoteEditing(true)}
          style={{
            width: "100%", textAlign: "left", padding: "9px 12px", borderRadius: 8, border: "1px dashed #4A4A4A",
            background: "transparent", color: "#7A7A7A", fontSize: 12, cursor: "pointer", marginBottom: 12,

      {suppressTimer ? (
        <p style={{ fontSize: 11, color: "#A8A8A8", background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>

        </p>
      ) : (
        <div style={{ marginBottom: 12 }}>
          <button
            onClick={() => setTimerOpen((v) => !v)}
            style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A", color: "#D6D6D6", fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: timerOpen ? 8 : 0 }}

        </div>
      )}
      {lastEntry && <LastRecordPanel lastEntry={lastEntry} onApply={applyLastEntry} onApplySuggestion={applySuggestion} />}
      {lastEntry && (
        <button
          onClick={applyLastEntry}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "9px 0", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A",
            color: "#D6D6D6", fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: 12,

        >
          <span style={{ color: ACCENT }}>↻</span> 前回と同じ内容を入力

            )}
          </div>

          <SetRowInputs s={s} idx={idx} supportsBodyweight={supportsBodyweight} supportsAssist={supportsAssist} updateSet={updateSet} setMode={setMode} />
        </div>
      ))}
      <button
        onClick={addSetRow}
        style={{ fontSize: 12, color: ACCENT, background: "transparent", border: "1px dashed #6B332F", borderRadius: 8, padding: "7px 0", width: "100%", cursor: "pointer", marginBottom: 12, fontWeight: 600 }}
      >
        + セットを追加(前と同じ値)
      </button>
      {error && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 10px" }}>{error}</p>}
      <div style={{ display: "flex", gap: 8, position: "sticky", bottom: "calc(env(safe-area-inset-bottom) + 66px)", background: "#161616", padding: "10px 0 2px", zIndex: 5, borderTop: "1px solid #232323" }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          キャンセル
        </button>
        <button onClick={handleSave} style={{ flex: 2, padding: "12px 0", borderRadius: 10, border: "none", background: ACCENT, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          記録する
        </button>
      </div>
    </div>
  );
}

function EditSetsForm({ entry, onSave, onCancel, customBodyweightNames }) {
  const [sets, setSets] = useState(
    entry.sets.map((s) => ({
      weight: s.bodyweight ? "" : String(s.weight),
      reps: String(s.reps),
      bodyweight: !!s.bodyweight,
      ...(s.bodyweight && s.assist > 0 ? { assist: String(s.assist) } : {}),
    }))
  );
  const [error, setError] = useState("");
  const [dateVal, setDateVal] = useState(entry.date);
  const supportsBodyweight = BODYWEIGHT_EXERCISES.has(entry.exerciseName) || (customBodyweightNames || []).includes(entry.exerciseName);
  const supportsAssist = supportsAssistName(entry.exerciseName);

  function updateSet(idx, field, value) {
    setSets(sets.map((s, i) => (i === idx ? { ...s, [field]: value } : s)));
  }

  function setMode(idx, mode) {
    setSets(sets.map((s, i) => {
      if (i !== idx) return s;
      const { assist, ...rest } = s;
      if (mode === "weight") return { ...rest, bodyweight: false, weight: "" };
      if (mode === "bw") return { ...rest, bodyweight: true, weight: "" };
      return { ...rest, bodyweight: true, weight: "", assist: "" };
    }));
  }

  function addSetRow() {
    const last = sets[sets.length - 1];
    setSets([...sets, { weight: last ? last.weight : "", reps: last ? last.reps : "", bodyweight: last?.bodyweight || false, ...(last && last.assist !== undefined ? { assist: last.assist } : {}) }]);
  }

  function removeSetRow(idx) {
    setSets(sets.filter((_, i) => i !== idx));
  }

  function handleSave() {
    const parsed = sets
      .map((s) => {
        const a = parseFloat(s.assist);
        return {
          weight: s.bodyweight ? 0 : parseFloat(s.weight),
          reps: parseInt(s.reps, 10),
          bodyweight: !!s.bodyweight,
          ...(s.bodyweight && a > 0 ? { assist: a } : {}),
        };
      })
      .filter((s) => !isNaN(s.reps) && s.reps > 0 && (s.bodyweight || (!isNaN(s.weight) && s.weight > 0)));
    if (parsed.length === 0) {
      setError("重量(または自重)と回数を1セット以上入力してください");
      return;
    }
    if (!dateVal) {
      setError("日付を選んでください");
      return;
    }
    onSave(parsed, dateVal);
  }

  return (
    <div style={{ background: "#161616", border: `1px solid ${ACCENT}`, borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          {entry.exerciseName}を編集
        </p>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <span style={{ fontSize: 12, color: "#A8A8A8", fontWeight: 600, flexShrink: 0 }}>日付</span>
        <input
          type="date" value={dateVal} max={todayStr()}
          onChange={(e) => setDateVal(e.target.value)}
          style={{ flex: 1, padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 14, colorScheme: "dark" }}
        />
      </label>

      {sets.map((s, idx) => (
        <div key={idx} style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "10px 10px 10px 12px", marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 11, color: "#A8A8A8", fontWeight: 600 }}>{idx + 1}セット目</span>
            {sets.length > 1 && (
              <button onClick={() => removeSetRow(idx)} aria-label="このセットを削除" style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 16, cursor: "pointer", padding: "0 2px", lineHeight: 1 }}>×</button>
            )}
          </div>

          <SetRowInputs s={s} idx={idx} supportsBodyweight={supportsBodyweight} supportsAssist={supportsAssist} updateSet={updateSet} setMode={setMode} />
        </div>
      ))}
      <button
        onClick={addSetRow}
        style={{ fontSize: 12, color: ACCENT, background: "transparent", border: "1px dashed #6B332F", borderRadius: 8, padding: "7px 0", width: "100%", cursor: "pointer", marginBottom: 12, fontWeight: 600 }}
      >
        + セットを追加(前と同じ値)
      </button>
      {error && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 10px" }}>{error}</p>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          キャンセル
        </button>
        <button onClick={handleSave} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "none", background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          保存する
        </button>
      </div>
    </div>
  );
}

function ExercisePicker({ onSelect, onClose, customExercises, onAddCustom, onDeleteCustom, favorites, onToggleFavorite, entries }) {
  // number of distinct days each exercise has been logged
  const usage = useMemo(() => {
    const days = {};
    (entries || []).forEach((e) => { (days[e.exerciseName] = days[e.exerciseName] || new Set()).add(e.date); });
    const out = {};
    Object.keys(days).forEach((k) => { out[k] = days[k].size; });
    return out;
  }, [entries]);
  const FREQ_MIN = 3;
  const useCount = (n) => usage[n] || 0;
  const [activeCategory, setActiveCategory] = useState(CATEGORIES[0].key);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [newBodyweight, setNewBodyweight] = useState(false);
  const [formError, setFormError] = useState("");
  const [query, setQuery] = useState("");
  const pickerRef = useRef(null);
  const [equip, setEquip] = useState("all");
  useEffect(() => {
    if (pickerRef.current) pickerRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);
  const category = CATEGORIES.find((c) => c.key === activeCategory);
  const q = query.trim().toLowerCase();
  const searchResults = q
    ? CATEGORIES.flatMap((c) =>
        getCategoryExercises(c, customExercises)
          .filter((n) => n.toLowerCase().includes(q) && (equip === "all" || getEquipment(n) === equip))
          .map((n) => ({ name: n, cat: c, custom: ((customExercises && customExercises[c.key]) || []).includes(n) }))
      ).sort((a, b) => useCount(b.name) - useCount(a.name))
    : [];
  const customList = (customExercises && customExercises[category.key]) || [];

  function openAddForm() {
    setAdding(true);
    setNewName("");
    setNewBodyweight(false);
    setFormError("");
  }

  function handleAdd() {
    const trimmed = newName.trim();
    if (!trimmed) {
      setFormError("種目名を入力してください");
      return;
    }
    const allNames = getCategoryExercises(category, customExercises).map((n) => n.toLowerCase());
    if (allNames.includes(trimmed.toLowerCase())) {
      setFormError("同じ名前の種目がすでにあります");
      return;
    }
    onAddCustom(category.key, trimmed, newBodyweight);
    setAdding(false);
    setNewName("");
    setNewBodyweight(false);
    setFormError("");
  }

  const equipChips = (
    <div style={{ display: "flex", gap: 6, marginBottom: 12, overflowX: "auto" }}>
        {[{ key: "all", label: "すべて", color: ACCENT }, ...EQUIPMENTS.filter((e) => e.key !== "other")].map((e) => (
          <button
            key={e.key}
            onClick={() => setEquip(e.key)}
            style={{
              flexShrink: 0, fontSize: 12, padding: "5px 12px", borderRadius: 8, cursor: "pointer", fontWeight: 700,
              border: equip === e.key ? `1px solid ${e.color}` : "1px solid #363636",
              background: equip === e.key ? `${e.color}22` : "transparent",
              color: equip === e.key ? e.color : "#A8A8A8",
            }}
          >
            {e.label}
          </button>
        ))}
      </div>
  );

  return (
    <div ref={pickerRef} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginTop: 8, scrollMarginTop: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>種目を選ぶ</p>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 13, cursor: "pointer" }}>閉じる</button>
      </div>
      <div style={{ position: "relative", marginBottom: 12 }}>
        <input
          type="text" value={query} onChange={(e) => setQuery(e.target.value)}
          placeholder="種目を検索(例: ケーブル、プレス)"
          style={{ width: "100%", padding: "10px 34px 10px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 14 }}
        />
        {query && (
          <button onClick={() => setQuery("")} aria-label="検索をクリア" style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", background: "transparent", border: "none", color: "#A8A8A8", fontSize: 16, cursor: "pointer", padding: "4px 8px" }}>×</button>
        )}
      </div>
      {q ? (<>
        {equipChips}
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto", marginBottom: 4 }}>
          {searchResults.length === 0 && <p style={{ fontSize: 12, color: "#7A7A7A", margin: "8px 0", textAlign: "center" }}>該当する種目がありません</p>}
          {searchResults.map((r) => {
            const isFav = favorites.includes(r.name);
            return (
              <div key={r.cat.key + r.name} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <button
                  onClick={() => onSelect(r.name, r.cat.key)}
                  style={{ flex: 1, padding: "10px 12px", borderRadius: 10, border: r.custom ? `1px solid ${ACCENT}` : "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 13, cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", gap: 8 }}
                >
                  <span>{r.name}</span>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                    <EquipTag name={r.name} />
                    <span style={{ fontSize: 10, color: "#7A7A7A" }}>{r.cat.label}{useCount(r.name) > 0 ? ` ・${useCount(r.name)}回` : ""}</span>
                  </span>
                </button>
                <button
                  onClick={() => onToggleFavorite(r.name)}
                  aria-label={isFav ? `${r.name}をお気に入りから外す` : `${r.name}をお気に入りに登録`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: isFav ? ACCENT : "#7A7A7A", fontSize: 15, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >{isFav ? "★" : "☆"}</button>
              </div>
            );
          })}
        </div>
      </>) : (<>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
        {CATEGORIES.map((c) => (
          <button
            key={c.key}
            onClick={() => { setActiveCategory(c.key); setAdding(false); }}
            style={{
              flexShrink: 0, fontSize: 12, padding: "6px 14px", borderRadius: 999,
              border: activeCategory === c.key ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: activeCategory === c.key ? "rgba(232,53,43,0.12)" : "transparent",
              color: activeCategory === c.key ? ACCENT : "#A8A8A8",
              fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
            }}
          >
            {c.label}
          </button>
        ))}
      </div>
      {equipChips}
      <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 280, overflowY: "auto", paddingRight: 2, marginBottom: 12 }}>
        {(() => {
          const sortFav = (arr) => [...arr].sort((a, b) => (favorites.includes(b) ? 1 : 0) - (favorites.includes(a) ? 1 : 0));
          const equipOk = (n) => equip === "all" || getEquipment(n) === equip;
          const freq = category.exercises.filter((n) => useCount(n) >= FREQ_MIN && equipOk(n)).sort((a, b) => useCount(b) - useCount(a));
          const freqSet = new Set(freq);
          const groups = EQUIPMENTS
            .map((e) => ({ e, items: sortFav(category.exercises.filter((n) => getEquipment(n) === e.key && !freqSet.has(n))) }))
            .filter((g) => g.items.length > 0 && (equip === "all" || g.e.key === equip));
          if (freq.length > 0) groups.unshift({ e: { key: "freq", label: "よく使う", color: ACCENT }, items: freq, freq: true });
          if (groups.length === 0) return <p style={{ fontSize: 12, color: "#7A7A7A", margin: "8px 0", textAlign: "center" }}>この部位にはその器具の種目がありません</p>;
          return groups.map((g) => (
            <React.Fragment key={g.e.key}>
              {((equip === "all" && groups.length > 1) || g.freq) && (
                <p style={{ fontSize: 11, fontWeight: 700, color: g.e.color, margin: "8px 0 0", letterSpacing: "0.04em" }}>
                  {g.e.label} <span style={{ color: "#7A7A7A", fontWeight: 500 }}>{g.freq ? `(${FREQ_MIN}回以上記録)` : g.items.length}</span>
                </p>
              )}
              {g.items.map((ex) => {
                const isFav = favorites.includes(ex);
                return (
                  <div key={ex} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <button
                      onClick={() => onSelect(ex, category.key)}
                      style={{
                        flex: 1, padding: "11px 12px", borderRadius: 10,
                        border: isFav ? `1px solid ${ACCENT}` : "1px solid #363636",
                        background: isFav ? "rgba(232,53,43,0.06)" : "#0A0A0A",
                        color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
                      }}
                    >
                      {g.freq ? (
                        <span style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                          <span>{ex}</span>
                          <span style={{ display: "inline-flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                            <EquipTag name={ex} />
                            <span style={{ fontSize: 10, color: "#7A7A7A" }}>{useCount(ex)}回</span>
                          </span>
                        </span>
                      ) : ex}
                    </button>
                    <button
                      onClick={() => onToggleFavorite(ex)}
                      aria-label={isFav ? `${ex}をお気に入りから外す` : `${ex}をお気に入りに登録`}
                      style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: isFav ? ACCENT : "#7A7A7A", fontSize: 15, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                    >
                      {isFav ? "★" : "☆"}
                    </button>
                  </div>
                );
              })}
            </React.Fragment>
          ));
        })()}
        {customList.length > 0 && (
          <p style={{ fontSize: 10, fontWeight: 700, color: "#A8A8A8", margin: "6px 0 0", textTransform: "uppercase", letterSpacing: "0.05em" }}>
            自分の種目
          </p>
        )}
        {[...customList]
          .filter((n) => equip === "all" || getEquipment(n) === equip)
          .sort((a, b) => (useCount(b) - useCount(a)) || ((favorites.includes(b) ? 1 : 0) - (favorites.includes(a) ? 1 : 0)))
          .map((ex) => {
            const isFav = favorites.includes(ex);
            return (
              <div key={ex} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <button
                  onClick={() => onSelect(ex, category.key)}
                  style={{
                    flex: 1, padding: "11px 12px", borderRadius: 10, border: `1px solid ${ACCENT}`, background: "rgba(232,53,43,0.08)",
                    color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
                  }}
                >
                  {ex}
                </button>
                <button
                  onClick={() => onToggleFavorite(ex)}
                  aria-label={isFav ? `${ex}をお気に入りから外す` : `${ex}をお気に入りに登録`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: isFav ? ACCENT : "#7A7A7A", fontSize: 15, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >
                  {isFav ? "★" : "☆"}
                </button>
                <button
                  onClick={() => onDeleteCustom(category.key, ex)}
                  aria-label={`${ex}を削除`}
                  style={{ background: "transparent", border: "1px solid #363636", borderRadius: 8, color: "#A8A8A8", fontSize: 14, cursor: "pointer", padding: "8px 10px", flexShrink: 0 }}
                >
                  ×
                </button>
              </div>
            );
          })}
      </div>

      {adding ? (
        <div style={{ background: "#0A0A0A", border: "1px solid #363636", borderRadius: 10, padding: "12px" }}>
          <input
            type="text" value={newName} onChange={(e) => setNewName(e.target.value)}
            placeholder={`${category.label}のオリジナル種目名`} autoFocus
            style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", fontSize: 13, marginBottom: 8 }}
          />
          <button
            onClick={() => setNewBodyweight((v) => !v)}
            style={{
              display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left",
              padding: "8px 10px", borderRadius: 8, marginBottom: 10, cursor: "pointer",
              border: newBodyweight ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: newBodyweight ? "rgba(232,53,43,0.1)" : "transparent",
            }}
          >
            <span style={{
              width: 16, height: 16, borderRadius: 4, flexShrink: 0,
              border: `2px solid ${newBodyweight ? ACCENT : "#7A7A7A"}`,
              background: newBodyweight ? ACCENT : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 10, fontWeight: 700,
            }}>
              {newBodyweight ? "✓" : ""}
            </span>
            <span style={{ fontSize: 12, color: "#D6D6D6" }}>自重種目として記録する</span>
          </button>
          {formError && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 8px" }}>{formError}</p>}
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => setAdding(false)}
              style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 12, fontWeight: 600, cursor: "pointer" }}
            >
              キャンセル
            </button>
            <button
              onClick={handleAdd}
              style={{ flex: 1, padding: "9px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}
            >
              追加する
            </button>
          </div>
        </div>
      ) : (
        <button
          onClick={openAddForm}
          style={{
            width: "100%", textAlign: "center", padding: "10px 12px", borderRadius: 10, border: "1px dashed #6B332F",
            background: "transparent", color: ACCENT, fontSize: 12, fontWeight: 700, cursor: "pointer",
            fontFamily: "'Oswald', sans-serif", textTransform: "uppercase",
          }}
        >
          + {category.label}にオリジナル種目を追加
        </button>
      )}
      </>)}
    </div>
  );
}

function estimated1RM(weight, reps) {
  return weight * (1 + reps / 30);
}

function ProgressChart({ entries }) {
  const exerciseNames = useMemo(() => {
    const set = new Set(entries.map((e) => e.exerciseName));
    return Array.from(set);
  }, [entries]);
  const [selected, setSelected] = useState(null);
  const [page, setPage] = useState(0);
  const [metric, setMetric] = useState("actual"); // actual | estimated1rm

  useEffect(() => {
    if (selected && !exerciseNames.includes(selected)) setSelected(null);
  }, [exerciseNames]);

  if (exerciseNames.length === 0) {
    return <p style={{ fontSize: 13, color: "#A8A8A8" }}>記録が増えると、種目ごとの重量推移がここに表示されます。</p>;
  }

  if (!selected) {
    return (
      <div>
        <p style={{ fontSize: 13, fontWeight: 600, margin: "0 0 12px", color: "#F5F5F5" }}>推移を見る種目を選んでください</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto", paddingRight: 2 }}>
          {exerciseNames.map((name) => (
            <button
              key={name}
              onClick={() => { setSelected(name); setPage(0); }}
              style={{
                padding: "11px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A",
                color: "#F5F5F5", fontSize: 13, fontWeight: 500, cursor: "pointer", textAlign: "left",
              }}
            >
              {name}
            </button>
          ))}
        </div>
      </div>
    );
  }

  const pageSize = 8;
  const allSessions = entries
    .filter((e) => e.exerciseName === selected)
    .map((e) => {
      const weightedSets = e.sets.filter((s) => !s.bodyweight);
      const hasBodyweightSet = e.sets.some((s) => s.bodyweight);
      if (weightedSets.length > 0) {
        const value = metric === "estimated1rm"
          ? Math.max(...weightedSets.map((s) => estimated1RM(s.weight, s.reps)))
          : Math.max(...weightedSets.map((s) => s.weight));
        return { date: e.date, topWeight: Math.round(value * 10) / 10, isBodyweight: false };
      }
      if (hasBodyweightSet) {
        return { date: e.date, topWeight: 0, isBodyweight: true };
      }
      return null;
    })
    .filter(Boolean)
    .sort((a, b) => (a.date < b.date ? -1 : 1));

  const maxPage = Math.max(0, Math.ceil(allSessions.length / pageSize) - 1);
  const end = allSessions.length - pageSize * page;
  const start = Math.max(0, end - pageSize);
  const sessions = allSessions.slice(start, end);

  const width = 320;
  const height = 130;
  const padX = 10;
  const padY = 16;
  const weights = sessions.map((s) => s.topWeight);
  const maxW = weights.length ? Math.max(...weights) : 0;
  const minW = weights.length ? Math.min(0, ...weights) : 0;
  const range = maxW - minW || 10;
  const stepX = sessions.length > 1 ? (width - padX * 2) / (sessions.length - 1) : 0;

  const points = sessions.map((s, i) => {
    const x = padX + i * stepX;
    const y = padY + (1 - (s.topWeight - minW) / range) * (height - padY * 2);
    return { x, y, w: s.topWeight, isBodyweight: s.isBodyweight };
  });
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const latest = sessions[sessions.length - 1];

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>{selected}</p>
        <button onClick={() => setSelected(null)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 12, cursor: "pointer" }}>種目を変更</button>
      </div>

      <div style={{ display: "flex", borderRadius: 8, border: "1px solid #363636", overflow: "hidden", marginBottom: 12 }}>
        <button
          onClick={() => setMetric("actual")}
          style={{
            flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
            background: metric === "actual" ? ACCENT : "transparent",
            color: metric === "actual" ? "#fff" : "#A8A8A8",
            fontSize: 11, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
          }}
        >
          実測トップ重量
        </button>
        <button
          onClick={() => setMetric("estimated1rm")}
          style={{
            flex: 1, padding: "7px 0", border: "none", cursor: "pointer",
            background: metric === "estimated1rm" ? ACCENT : "transparent",
            color: metric === "estimated1rm" ? "#fff" : "#A8A8A8",
            fontSize: 11, fontWeight: 700, fontFamily: "'Oswald', sans-serif",
          }}
        >
          推定1RM
        </button>
      </div>

      {allSessions.length === 0 ? (
        <p style={{ fontSize: 13, color: "#A8A8A8" }}>この種目の重量記録がまだありません。</p>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <button
              onClick={() => setPage((p) => Math.min(maxPage, p + 1))}
              disabled={page >= maxPage}
              aria-label="過去のセッション"
              style={{ background: "transparent", border: "1px solid #363636", color: page >= maxPage ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: page >= maxPage ? "default" : "pointer" }}
            >
              ‹
            </button>
            <span style={{ fontSize: 11, color: "#7A7A7A" }}>
              {sessions.length > 0 ? `${formatDateLabel(sessions[0].date)} 〜 ${formatDateLabel(sessions[sessions.length - 1].date)}` : ""}
            </span>
            <button
              onClick={() => setPage((p) => Math.max(0, p - 1))}
              disabled={page === 0}
              aria-label="最近のセッション"
              style={{ background: "transparent", border: "1px solid #363636", color: page === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: page === 0 ? "default" : "pointer" }}
            >
              ›
            </button>
          </div>

          <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label={`${selected}の重量推移`}>
            {pathD && <path d={pathD} fill="none" stroke={ACCENT} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />}
            {points.map((p, i) =>
              p.isBodyweight ? (
                <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#161616" stroke={ACCENT} strokeWidth="2" />
              ) : (
                <circle key={i} cx={p.x} cy={p.y} r="3" fill={ACCENT} />
              )
            )}
          </svg>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#7A7A7A", marginTop: 2 }}>
            <span>{formatDateLabel(sessions[0].date)}</span>
            <span>{formatDateLabel(sessions[sessions.length - 1].date)}</span>
          </div>
          {sessions.some((s) => s.isBodyweight) && (
            <p style={{ fontSize: 10, color: "#7A7A7A", marginTop: 6 }}>◎ 自重で行ったセッション</p>
          )}
          {latest && (
            <p style={{ fontSize: 12, color: "#A8A8A8", marginTop: 8 }}>
              直近の記録: <span style={{ color: "#F5F5F5", fontWeight: 700 }}>{latest.isBodyweight ? "自重" : `${latest.topWeight}kg`}</span>
            </p>
          )}
        </>
      )}
    </div>
  );
}

function CalendarView({ entries, onDeleteEntry, onEditEntry, sessions }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDate, setSelectedDate] = useState(todayStr());

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const dateKeys = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      map[e.date] = (map[e.date] || 0) + 1;
    });
    return map;
  }, [entries]);

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    cells.push(key);
  }

  const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];
  const selectedEntries = entries.filter((e) => e.date === selectedDate);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={() => setMonthOffset((m) => m - 1)} style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 30, height: 30, cursor: "pointer" }}>‹</button>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif" }}>{year}年{month + 1}月</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 30, height: 30, cursor: "pointer" }}>›</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
        {weekdayLabels.map((w) => (
          <div key={w} style={{ textAlign: "center", fontSize: 10, color: "#7A7A7A" }}>{w}</div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 16 }}>
        {cells.map((key, i) => {
          if (!key) return <div key={`empty-${i}`} />;
          const has = !!dateKeys[key];
          const isSelected = key === selectedDate;
          const isToday = key === todayStr();
          const dayNum = parseInt(key.slice(-2), 10);
          return (
            <button
              key={key}
              onClick={() => setSelectedDate(key)}
              style={{
                aspectRatio: "1", borderRadius: 8, border: isSelected ? `1px solid ${ACCENT}` : "1px solid transparent",
                background: isSelected ? "rgba(232,53,43,0.15)" : has ? "#161616" : "transparent",
                color: isToday ? ACCENT : "#F5F5F5", fontSize: 12, fontWeight: isToday ? 700 : 500,
                cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
              }}
            >
              <span>{dayNum}</span>
              {has && <span style={{ width: 4, height: 4, borderRadius: "50%", background: ACCENT }} />}
            </button>
          );
        })}
      </div>

      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 10px", color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
        {selectedDate} の記録
        {sessions && sessions[selectedDate] && (
          <span style={{ color: ACCENT, marginLeft: 8 }}>⏱ {sessions[selectedDate].minutes}分</span>
        )}
      </p>
      {selectedEntries.length === 0 ? (
        <p style={{ fontSize: 13, color: "#7A7A7A" }}>この日の記録はありません。</p>
      ) : (
        selectedEntries.map((e) => (
          <div key={e.id} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
              <p style={{ margin: 0, fontSize: 14, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>{e.exerciseName}</p>
              <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
                <button onClick={() => onEditEntry(e)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
                <button onClick={() => onDeleteEntry(e.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {e.sets.map((s, i) => (
                <span key={i} style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                  {setLabel(s)} × {s.reps}回

        ))
      )}
    </div>
  );
}
