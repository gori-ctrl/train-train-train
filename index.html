function runTypeLabel(r) {
  return r && r.type === "cross" ? "クロストレーナー" : "ランニング";
}

function formatPace(distanceKm, durationSec) {
  if (!distanceKm || distanceKm <= 0) return "—";
  const paceSec = durationSec / distanceKm;
  const m = Math.floor(paceSec / 60);
  const s = Math.round(paceSec % 60);
  const ss = s === 60 ? "00" : String(s).padStart(2, "0");
  const mm = s === 60 ? m + 1 : m;
  return `${mm}'${ss}"`;
}

function formatRunDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function computeRunDistanceSeries(runLog, range, offset) {
  const buckets = range === "week" ? 8 : 6;
  const series = [];
  if (range === "week") {
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const dow = now.getDay();
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const thisMonday = new Date(now);
    thisMonday.setDate(now.getDate() + diffToMonday);
    for (let i = buckets - 1; i >= 0; i--) {
      const start = new Date(thisMonday);
      start.setDate(thisMonday.getDate() - (offset * buckets + i) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const startKey = localDateStr(start);
      const endKey = localDateStr(end);
      const total = runLog.filter((r) => r.date >= startKey && r.date <= endKey).reduce((s, r) => s + r.distanceKm, 0);
      series.push({ label: `${start.getMonth() + 1}/${start.getDate()}`, total });
    }
  } else {
    const now = new Date();
    now.setDate(1);
    for (let i = buckets - 1; i >= 0; i--) {
      const d = new Date(now);
      d.setMonth(now.getMonth() - (offset * buckets + i));
      const y = d.getFullYear(), m = d.getMonth();
      const prefix = `${y}-${String(m + 1).padStart(2, "0")}`;
      const total = runLog.filter((r) => r.date.startsWith(prefix)).reduce((s, r) => s + r.distanceKm, 0);
      series.push({ label: `${m + 1}月`, total });
    }
  }
  return series;
}

function WheelPicker({ columns, height = 180 }) {
  const ITEM = 36;
  const pad = (height - ITEM) / 2;
  return (
    <div style={{ position: "relative", display: "flex", background: "#0A0A0A", border: "1px solid #363636", borderRadius: 14, overflow: "hidden", height }}>
      <div style={{ position: "absolute", left: 8, right: 8, top: pad, height: ITEM, background: "rgba(255,255,255,0.08)", borderRadius: 10, pointerEvents: "none" }} />
      {columns.map((c, i) => <WheelColumn key={i} col={c} itemH={ITEM} pad={pad} />)}
      <div style={{ position: "absolute", inset: 0, pointerEvents: "none", background: "linear-gradient(#0A0A0A 0%, rgba(10,10,10,0) 32%, rgba(10,10,10,0) 68%, #0A0A0A 100%)" }} />
    </div>
  );
}

function WheelColumn({ col, itemH, pad }) {
  const ref = useRef(null);
  const timer = useRef(null);
  const userScrolling = useRef(false);
  const idx = Math.max(0, col.values.findIndex((v) => String(v) === String(col.value)));
  useEffect(() => {
    const el = ref.current;
    if (!el || userScrolling.current) return;
    if (Math.abs(el.scrollTop - idx * itemH) > 2) el.scrollTop = idx * itemH;
  }, [idx, itemH]);
  function onScroll() {
    const el = ref.current;
    userScrolling.current = true;
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      userScrolling.current = false;
      const i = Math.min(col.values.length - 1, Math.max(0, Math.round(el.scrollTop / itemH)));
      if (String(col.values[i]) !== String(col.value)) col.onChange(col.values[i]);
    }, 90);
  }
  return (
    <div style={{ position: "relative", flex: 1, minWidth: 0 }}>
      <div
        ref={ref} className="wheel-col" onScroll={onScroll}
        style={{ height: "100%", overflowY: "scroll", scrollSnapType: "y mandatory", overscrollBehavior: "contain", scrollbarWidth: "none", WebkitOverflowScrolling: "touch", touchAction: "pan-y" }}
      >
        <div style={{ height: pad }} />
        {col.values.map((v, i) => (
          <div
            key={v}
            onClick={() => ref.current && ref.current.scrollTo({ top: i * itemH, behavior: "smooth" })}
            style={{ height: itemH, scrollSnapAlign: "center", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: i === idx ? 600 : 400, color: i === idx ? "#F5F5F5" : "#7A7A7A", cursor: "pointer", paddingRight: col.suffix ? 26 : 0 }}
          >
            {col.pad ? String(v).padStart(2, "0") : v}
          </div>
        ))}
        <div style={{ height: pad }} />
      </div>
      {col.suffix && (
        <span style={{ position: "absolute", top: "50%", left: "calc(50% + 14px)", transform: "translateY(-50%)", fontSize: 14, fontWeight: 600, color: "#F5F5F5", pointerEvents: "none" }}>{col.suffix}</span>
      )}
    </div>
  );
}

function WheelSection({ summary, open, setOpen, children }) {
  if (!open) {
    return (
      <button
        onClick={() => setOpen(true)}
        style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 14px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 15, fontWeight: 600, cursor: "pointer" }}
      >
        <span>{summary}</span>
        <span style={{ fontSize: 12, color: "#7A7A7A", fontWeight: 500 }}>変更 ›</span>
      </button>
    );
  }
  return (
    <div>
      {children}
      <button
        onClick={() => setOpen(false)}
        style={{ width: "100%", marginTop: 8, padding: "10px 0", borderRadius: 10, border: "none", background: "#262626", color: "#F5F5F5", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
      >
        完了
      </button>
    </div>
  );
}

const LOAD_KINDS = [
  { key: "incline", label: "傾斜", fmt: (v) => `傾斜${v}%`, re: /^傾斜(.+)%$/, values: Array.from({ length: 15 }, (_, i) => String(i + 1)), unit: "%" },
  { key: "level", label: "レベル", fmt: (v) => `レベル${v}`, re: /^レベル(.+)$/, values: Array.from({ length: 20 }, (_, i) => String(i + 1)), unit: "" },
  { key: "speed", label: "速度", fmt: (v) => `速度${v}km/h`, re: /^速度(\d+(?:\.\d)?)km\/h$/, values: null, unit: "km/h" },
];
function parseLoad(text) {
  if (!text) return { kind: "none", value: "", other: "" };
  for (const k of LOAD_KINDS) {
    const m = text.match(k.re);
    if (m && (k.values === null || k.values.includes(m[1]))) return { kind: k.key, value: k.values === null ? Number(m[1]).toFixed(1) : m[1], other: "" };
  }
  return { kind: "other", value: "", other: text };
}
function LoadPicker({ value, onChange }) {
  const init = parseLoad(value);
  const [kind, setKind] = useState(init.kind);
  const [val, setVal] = useState(init.value);
  const [other, setOther] = useState(init.other);
  const [speedOpen, setSpeedOpen] = useState(!(init.kind === "speed" && init.value));
  const valRef = useRef(init.value);
  valRef.current = val;
  function emit(k, v, o) {
    if (k === "none") return onChange("");
    if (k === "other") return onChange(o.trim());
    const def = LOAD_KINDS.find((x) => x.key === k);
    onChange(v ? def.fmt(v) : "");
  }
  function pickKind(k) {
    setKind(k);
    if (k === "speed") setSpeedOpen(true);
    const def = LOAD_KINDS.find((x) => x.key === k);
    const v = def ? (def.values === null ? (val || "8.0") : (val && def.values.includes(val) ? val : "")) : "";
    setVal(v);
    emit(k, v, other);
  }
  const chips = [{ key: "none", label: "なし" }, ...LOAD_KINDS, { key: "other", label: "その他" }];
  const def = LOAD_KINDS.find((x) => x.key === kind);
  return (
    <div style={{ marginBottom: 12 }}>
      <p style={{ fontSize: 11, color: "#A8A8A8", margin: "0 0 6px" }}>負荷(任意)</p>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: kind === "none" ? 0 : 8 }}>
        {chips.map((c) => (
          <button
            key={c.key} onClick={() => pickKind(c.key)}
            style={{
              fontSize: 12, padding: "6px 14px", borderRadius: 999, cursor: "pointer", fontWeight: 700,
              border: kind === c.key ? `1px solid ${ACCENT}` : "1px solid #363636",
              background: kind === c.key ? "rgba(232,53,43,0.12)" : "transparent",
              color: kind === c.key ? ACCENT : "#A8A8A8",
            }}
          >
            {c.label}
          </button>
        ))}
      </div>
      {def && def.values === null && (() => {
        const [ip, dp] = (val || "8.0").split(".");
        const setSpeedPart = (part, v) => {
          const [ci, cd] = (valRef.current || "8.0").split(".");
          const nv = part === "int" ? `${Number(v)}.${cd || "0"}` : `${Number(ci)}.${v}`;
          valRef.current = nv;
          setVal(nv);
          emit(kind, nv, other);
        };
        return (
          <WheelSection open={speedOpen} setOpen={setSpeedOpen} summary={`速度 ${Number(ip)}.${dp || "0"} km/h`}>
          <WheelPicker height={150} columns={[
            { values: Array.from({ length: 31 }, (_, i) => String(i)), value: String(Number(ip)), onChange: (v) => setSpeedPart("int", v), suffix: "." },
            { values: Array.from({ length: 10 }, (_, i) => String(i)), value: dp || "0", onChange: (v) => setSpeedPart("dec", v), suffix: "km/h" },
          ]} />
          </WheelSection>
        );
      })()}
      {def && def.values !== null && (
        <select
          value={val} onChange={(e) => { setVal(e.target.value); emit(kind, e.target.value, other); }}
          style={{ width: "100%", padding: "10px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: val ? "#F5F5F5" : "#7A7A7A", fontSize: 14, colorScheme: "dark" }}
        >
          <option value="">{def.label}を選ぶ</option>
          {def.values.map((v) => <option key={v} value={v}>{v}{def.unit}</option>)}
        </select>
      )}
      {kind === "other" && (
        <input
          type="text" value={other} maxLength={30} placeholder="自由入力(例: 抵抗弱め)"
          onChange={(e) => { setOther(e.target.value); emit("other", "", e.target.value); }}
          style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 13 }}
        />
      )}
    </div>
  );
}

function RunLogForm({ initial, type, onSave, onCancel }) {
  const kind = (initial && initial.type) || type || "run";
  const isCross = kind === "cross";
  const [date, setDate] = useState(initial?.date || todayStr());
  const [distance, setDistance] = useState(initial && initial.distanceKm ? String(initial.distanceKm) : "");
  const initSec = initial ? initial.durationSec : 30 * 60;
  const [hours, setHours] = useState(Math.floor(initSec / 3600));
  const [minutes, setMinutes] = useState(Math.floor((initSec % 3600) / 60));
  const [seconds, setSeconds] = useState(initSec % 60);
  const [timeOpen, setTimeOpen] = useState(!initial);
  const [load, setLoad] = useState(initial?.load || "");
  const [error, setError] = useState("");

  const distNum = parseFloat(distance);
  const durSec = hours * 3600 + minutes * 60 + seconds;
  const pacePreview = distNum > 0 && durSec > 0 ? formatPace(distNum, durSec) : null;

  function handleSave() {
    if (!isCross && (isNaN(distNum) || distNum <= 0)) {
      setError("距離を入力してください");
      return;
    }
    if (durSec <= 0) {
      setError("時間を入力してください");
      return;
    }
    onSave({ type: kind, date, distanceKm: isCross ? 0 : distNum, durationSec: durSec, load: load.trim() });
  }

  return (
    <div style={{ background: "#161616", border: `1px solid ${ACCENT}`, borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
      <p style={{ fontSize: 14, fontWeight: 700, margin: "0 0 12px", color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
        {initial ? `${runTypeLabel({ type: kind })}の記録を編集` : `${runTypeLabel({ type: kind })}を記録`}
      </p>

      <p style={{ fontSize: 11, color: "#A8A8A8", margin: "0 0 4px" }}>日付</p>
      <input
        type="date" value={date} max={todayStr()} onChange={(e) => e.target.value && setDate(e.target.value)}
        style={{ width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 13, marginBottom: 12, colorScheme: "dark" }}
      />

      {!isCross && (
        <>
          <p style={{ fontSize: 11, color: "#A8A8A8", margin: "0 0 4px" }}>距離(km)</p>
          <input
            type="number" inputMode="decimal" placeholder="例: 5.0" value={distance}
            onChange={(e) => setDistance(e.target.value)}
            style={{ width: "100%", padding: "10px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 14, marginBottom: 12 }}
          />
        </>
      )}

      <p style={{ fontSize: 11, color: "#A8A8A8", margin: "0 0 6px" }}>時間</p>
      <div style={{ marginBottom: 12 }}>
        <WheelSection open={timeOpen} setOpen={setTimeOpen} summary={`${hours > 0 ? `${hours}時間 ` : ""}${minutes}分 ${seconds}秒`}>
          <WheelPicker columns={[
            { values: Array.from({ length: 6 }, (_, i) => i), value: hours, onChange: setHours, suffix: "時間" },
            { values: Array.from({ length: 60 }, (_, i) => i), value: minutes, onChange: setMinutes, suffix: "分" },
            { values: Array.from({ length: 60 }, (_, i) => i), value: seconds, onChange: setSeconds, suffix: "秒" },
          ]} />
        </WheelSection>
      </div>

      {isCross ? (
        <div style={{ marginBottom: 12 }}>
          <p style={{ fontSize: 11, color: "#A8A8A8", margin: "0 0 6px" }}>負荷(1〜15)</p>
          <select
            value={load} onChange={(e) => setLoad(e.target.value)}
            style={{ width: "100%", padding: "10px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: load ? "#F5F5F5" : "#7A7A7A", fontSize: 14, colorScheme: "dark" }}
          >
            <option value="">負荷を選ぶ</option>
            {Array.from({ length: 15 }, (_, i) => <option key={i + 1} value={`レベル${i + 1}`}>レベル{i + 1}</option>)}
          </select>
        </div>
      ) : (
        <LoadPicker value={load} onChange={setLoad} />
      )}

      {pacePreview && (
        <p style={{ fontSize: 12, color: "#D6D6D6", background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "8px 10px", marginBottom: 12 }}>
          平均ペース: <span style={{ color: ACCENT, fontWeight: 700 }}>{pacePreview}</span> /km
        </p>
      )}

      {error && <p style={{ color: ACCENT, fontSize: 12, margin: "0 0 10px" }}>{error}</p>}

      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "1px solid #363636", background: "transparent", color: "#A8A8A8", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
          キャンセル
        </button>
        <button onClick={handleSave} style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "none", background: ACCENT, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
          {initial ? "保存する" : "記録する"}
        </button>
      </div>
    </div>
  );
}

function RunTab({ runLog, onAdd, onUpdate, onDelete }) {
  const [mode, setMode] = useState("idle"); // idle | logging | editing
  const [runType, setRunType] = useState("run");
  const [editingRun, setEditingRun] = useState(null);
  const [range, setRange] = useState("week");
  const [offset, setOffset] = useState(0);

  function changeRange(key) {
    setRange(key);
    setOffset(0);
  }

  const thisWeekStart = dateStrOffset(-6);
  const lastWeekStart = dateStrOffset(-13);
  const lastWeekEnd = dateStrOffset(-7);
  const thisMonthPrefix = todayStr().slice(0, 7);
  const thisWeekDistance = runLog.filter((r) => r.date >= thisWeekStart).reduce((s, r) => s + r.distanceKm, 0);
  const lastWeekDistance = runLog.filter((r) => r.date >= lastWeekStart && r.date <= lastWeekEnd).reduce((s, r) => s + r.distanceKm, 0);
  const thisMonthDistance = runLog.filter((r) => r.date.startsWith(thisMonthPrefix)).reduce((s, r) => s + r.distanceKm, 0);

  const series = computeRunDistanceSeries(runLog, range, offset);
  const width = 320;
  const height = 130;
  const padX = 10;
  const padY = 16;
  const totals = series.map((s) => s.total);
  const maxV = Math.max(1, ...totals);
  const stepX = series.length > 1 ? (width - padX * 2) / (series.length - 1) : 0;
  const barW = Math.max(6, (width - padX * 2) / series.length - 4);

  const sortedRuns = [...runLog].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1)));

  function handleAdd(data) {
    onAdd(data);
    setMode("idle");
  }

  function handleUpdate(data) {
    onUpdate(editingRun.id, data);
    setMode("idle");
    setEditingRun(null);
  }

  function startEdit(run) {
    setEditingRun(run);
    setMode("editing");
  }

  return (
    <div>
      {mode === "idle" && (
        <div style={{ marginBottom: 16 }}>
          <p style={{ fontSize: 12, color: "#A8A8A8", margin: "0 0 8px" }}>記録する有酸素を選ぶ</p>
          <div style={{ display: "flex", gap: 10 }}>
            {[{ k: "run", icon: "🏃", label: "ランニング" }, { k: "cross", icon: "🚴", label: "クロストレーナー" }].map((o) => (
              <button
                key={o.k}
                onClick={() => { setRunType(o.k); setMode("logging"); }}
                style={{ flex: 1, padding: "16px 6px", borderRadius: 14, border: "1px solid #363636", background: "#161616", color: "#F5F5F5", cursor: "pointer", fontSize: 13, fontWeight: 700 }}
              >
                <span style={{ display: "block", fontSize: 24, marginBottom: 4 }}>{o.icon}</span>
                {o.label}
              </button>
            ))}
          </div>
        </div>
      )}

      {mode === "logging" && <RunLogForm type={runType} onSave={handleAdd} onCancel={() => setMode("idle")} />}
      {mode === "editing" && editingRun && (
        <RunLogForm initial={editingRun} onSave={handleUpdate} onCancel={() => { setMode("idle"); setEditingRun(null); }} />
      )}

      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週のランニング距離</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisWeekDistance.toFixed(1)}<span style={{ fontSize: 11, color: "#A8A8A8" }}>km</span></p>
          <p style={{ fontSize: 11, margin: "4px 0 0", color: "#7A7A7A" }}>先週: {lastWeekDistance.toFixed(1)}km</p>
        </div>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今月の合計距離(ランニング)</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisMonthDistance.toFixed(1)}<span style={{ fontSize: 11, color: "#A8A8A8" }}>km</span></p>
        </div>
      </div>

      <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <p style={{ fontSize: 13, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>ランニング距離の推移</p>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ key: "week", label: "週間" }, { key: "month", label: "月間" }].map((opt) => (
              <button
                key={opt.key}
                onClick={() => changeRange(opt.key)}
                style={{
                  fontSize: 11, padding: "4px 10px", borderRadius: 999,
                  border: range === opt.key ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: range === opt.key ? "rgba(232,53,43,0.12)" : "transparent",
                  color: range === opt.key ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <button
            onClick={() => setOffset((o) => o + 1)}
            aria-label="前の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: "pointer" }}
          >
            ‹
          </button>
          <span style={{ fontSize: 11, color: "#7A7A7A" }}>{series[0].label} 〜 {series[series.length - 1].label}</span>
          <button
            onClick={() => setOffset((o) => Math.max(0, o - 1))}
            disabled={offset === 0}
            aria-label="次の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: offset === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: offset === 0 ? "default" : "pointer" }}
          >
            ›
          </button>
        </div>

        <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="合計距離の推移グラフ">
          {series.map((s, i) => {
            const x = padX + i * stepX - barW / 2;
            const h = (s.total / maxV) * (height - padY * 2);
            const y = height - padY - h;
            return <rect key={i} x={x} y={y} width={barW} height={h} rx="2" fill={s.total > 0 ? ACCENT : "#242424"} />;
          })}
        </svg>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#7A7A7A", marginTop: 2 }}>
          <span>{series[0].label}</span>
          <span>{series[series.length - 1].label}</span>
        </div>
      </div>

      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 10px", color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>
        有酸素の履歴
      </p>
      {sortedRuns.length === 0 ? (
        <p style={{ fontSize: 13, color: "#7A7A7A" }}>まだ記録がありません。</p>
      ) : (
        sortedRuns.map((r) => (
          <div key={r.id} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif" }}>{formatDateLabel(r.date)}</p>
              <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
                <button onClick={() => startEdit(r)} style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer" }}>編集</button>
                <button onClick={() => onDelete(r.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer" }}>削除</button>
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              <span style={{ fontSize: 11, fontWeight: 700, background: "transparent", border: `1px solid ${r.type === "cross" ? "#4CC38A55" : "#E8A33B55"}`, borderRadius: 8, padding: "4px 9px", color: r.type === "cross" ? "#4CC38A" : "#E8A33B" }}>
                {runTypeLabel(r)}
              </span>
              {r.type !== "cross" && (
                <span style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                  {r.distanceKm}km
                </span>
              )}
              <span style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                {formatRunDuration(r.durationSec)}
              </span>
              {r.type !== "cross" && (
                <span style={{ fontSize: 12, background: "#0A0A0A", border: "1px solid #363636", borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                  {formatPace(r.distanceKm, r.durationSec)}/km
                </span>
              )}
              {r.load && (
                <span style={{ fontSize: 12, background: "rgba(232,53,43,0.08)", border: `1px solid ${ACCENT}55`, borderRadius: 8, padding: "4px 9px", color: "#D6D6D6" }}>
                  負荷 {r.load}
                </span>
              )}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

    <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px" }}>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>

function computeCategoryCounts(entries, days) {
  const cutoff = dateStrOffset(-(days - 1));
  const counts = {};
  CATEGORIES.forEach((c) => { counts[c.key] = 0; });
  entries.forEach((e) => {
    if (e.date >= cutoff && counts[e.category] !== undefined) {
      counts[e.category] += 1;
    }
  });
  return counts;
}

function computeStreak(trainedDates) {
  // trainedDates: Set of "YYYY-MM-DD" strings (strength entries + runs combined).
  if (trainedDates.size === 0) return { current: 0, longest: 0 };

  const today = todayStr();
  const yesterday = dateStrOffset(-1);
  let current = 0;
  if (trainedDates.has(today) || trainedDates.has(yesterday)) {
    // Count backward day-by-day from today (or yesterday, if today hasn't
    // been trained yet) so a streak isn't broken just because the day isn't
    // over yet.
    const cursor = new Date();
    cursor.setHours(0, 0, 0, 0);
    if (!trainedDates.has(today)) cursor.setDate(cursor.getDate() - 1);
    while (trainedDates.has(localDateStr(cursor))) {
      current += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
  }

  // Longest streak ever, scanning all known dates.
  const sorted = Array.from(trainedDates).sort();
  let longest = 0;
  let run = 0;
  let prevDate = null;
  for (const d of sorted) {
    if (prevDate) {
      const prev = new Date(prevDate + "T00:00:00");
      const cur = new Date(d + "T00:00:00");
      const diffDays = Math.round((cur - prev) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
    } else {
      run = 1;
    }
    longest = Math.max(longest, run);
    prevDate = d;
  }
  longest = Math.max(longest, current);

  return { current, longest };
}

function computeExerciseBests(entries) {
  const bests = {};
  entries.forEach((e) => {
    const weightedSets = e.sets.filter((s) => !s.bodyweight);
    if (weightedSets.length === 0) return;
    const top = Math.max(...weightedSets.map((s) => s.weight));
    if (!bests[e.exerciseName] || top > bests[e.exerciseName].weight) {
      bests[e.exerciseName] = { weight: top, date: e.date };
    }
  });
  return bests;
}

  }

  const bestWeight = best ? best.weight : 0;
  const pct = goal && goal.weight > 0 ? Math.min(100, Math.round((bestWeight / goal.weight) * 100)) : 0;
  const achieved = goal && bestWeight >= goal.weight;

  return (
    <div style={{ background: "#0A0A0A", border: achieved ? `1px solid ${ACCENT}` : "1px solid #363636", borderRadius: 12, padding: "12px 14px", marginBottom: 10 }}>

      {!editing && goal ? (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: "#A8A8A8" }}>現在: {bestWeight}kg / 目標: {goal.weight}kg × {goal.reps}回</span>
            <span style={{ fontSize: 11, color: achieved ? ACCENT : "#A8A8A8", fontWeight: 700 }}>{pct}%</span>

          <div style={{ height: 7, background: "#242424", borderRadius: 999, overflow: "hidden" }}>

          </div>
          <p style={{ fontSize: 10, color: "#7A7A7A", margin: "8px 0 0" }}>月間目標として設定中(いつでも変更できます)</p>

// Draws a branded portrait share-image onto an offscreen canvas and returns it.
// lines: array of { label, value, header? } — header rows render as a section title.
function drawSummaryCanvas({ title, dateLabel, lines, footer }) {
  const W = 1080;
  const H = 1350;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  // Background
  ctx.fillStyle = "#0A0A0A";
  ctx.fillRect(0, 0, W, H);

  // Top accent bar
  ctx.fillStyle = ACCENT;
  ctx.fillRect(0, 0, W, 14);

  // Title
  ctx.fillStyle = "#F5F5F5";
  ctx.font = "700 64px Oswald, sans-serif";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(title, 64, 150);

  // Date label
  ctx.fillStyle = ACCENT;
  ctx.font = "700 32px Oswald, sans-serif";
  ctx.fillText(dateLabel, 64, 200);

  // Divider
  ctx.strokeStyle = "#363636";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(64, 236);
  ctx.lineTo(W - 64, 236);
  ctx.stroke();

  // Rows
  let y = 310;
  lines.forEach((line) => {
    if (line.header) {
      ctx.fillStyle = ACCENT;
      ctx.font = "700 36px Oswald, sans-serif";
      ctx.fillText(line.header, 64, y);
      y += 56;
      return;
    }
    // Card background per row
    ctx.fillStyle = "#161616";
    ctx.strokeStyle = "#363636";
    ctx.lineWidth = 2;
    const cardY = y - 46;
    const cardH = 76;
    roundRect(ctx, 64, cardY, W - 128, cardH, 16);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#D6D6D6";
    ctx.font = "500 32px Inter, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(line.label, 96, y);

    ctx.fillStyle = "#F5F5F5";
    ctx.font = "700 36px Oswald, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(line.value, W - 96, y);
    ctx.textAlign = "left";

    y += cardH + 16;
  });

  // Footer
  if (footer) {
    ctx.fillStyle = "#7A7A7A";
    ctx.font = "600 26px Inter, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(footer, 64, H - 56);
  }

  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Converts a canvas to PNG and shares it via the native share sheet, falling
// back to text-only share, and finally to a plain download if Web Share
// isn't available at all.
function shareCanvasImage(canvas, filename, shareTitle, shareText) {
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], filename, { type: "image/png" });

    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: shareTitle, text: shareText });
        return;
      }
    } catch (e) {
      // User cancelled or share failed — fall through to next option.
      if (e && e.name === "AbortError") return;
    }

    try {
      if (navigator.share) {
        await navigator.share({ title: shareTitle, text: shareText });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }

    // Final fallback: trigger a download.
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, "image/png");
}

function formatElapsed(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  const mm = String(m).padStart(2, "0");
  const ss = String(sec).padStart(2, "0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

  if (dayEntries.length === 0 && dayRuns.length === 0) return null;

  function handleShare() {
    const lines = [];
    if (dayEntries.length > 0) {
      lines.push({ header: "筋トレ" });
      dayEntries.forEach((e) => {
        const top = e.sets.reduce((best, s) => {
          if (s.bodyweight) return best;
          return !best || s.weight * s.reps > best.weight * best.reps ? s : best;
        }, null);
        const value = top ? `${top.weight}kg × ${top.reps}回` : "自重";
        lines.push({ label: e.exerciseName, value });
      });
    }
    if (dayRuns.length > 0) {
      lines.push({ header: "有酸素" });

function WeeklyShareCard({ entries, runLog, sessions }) {
  const weekStart = dateStrOffset(-6);
  const weekEntries = entries.filter((e) => e.date >= weekStart);
  const weekRuns = runLog.filter((r) => r.date >= weekStart);

  if (weekEntries.length === 0 && weekRuns.length === 0) return null;

  const trainedDays = new Set([...weekEntries.map((e) => e.date), ...weekRuns.map((r) => r.date)]).size;
  const totalVolume = weekEntries.reduce((s, e) => s + computeEntryVolume(e), 0);
  const totalDistance = weekRuns.reduce((s, r) => s + r.distanceKm, 0);
  const totalMinutes = Object.entries(sessions || {})
    .filter(([d]) => d >= weekStart)
    .reduce((sum, [, v]) => sum + (v.minutes || 0), 0);
  const counts = computeCategoryCounts(entries, 7);
  const topCategory = [...CATEGORIES].sort((a, b) => counts[b.key] - counts[a.key])[0];

  function handleShare() {

function computeDailyVolumeSeries(entries, days, offset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  today.setDate(today.getDate() - offset * days);
  const byDate = {};
  entries.forEach((e) => {
    byDate[e.date] = (byDate[e.date] || 0) + computeEntryVolume(e);
  });
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = localDateStr(d);
    series.push({ date: key, label: `${d.getMonth() + 1}/${d.getDate()}`, volume: byDate[key] || 0 });
  }
  return series;
}

function AnalysisTab({ entries }) {
  const [range, setRange] = useState("week");
  const [offset, setOffset] = useState(0);
  const days = range === "week" ? 7 : 30;
  const series = computeDailyVolumeSeries(entries, days, offset);

  const thisWeekStart = dateStrOffset(-6);
  const lastWeekStart = dateStrOffset(-13);
  const lastWeekEnd = dateStrOffset(-7);
  const thisWeekVolume = entries.filter((e) => e.date >= thisWeekStart).reduce((s, e) => s + computeEntryVolume(e), 0);
  const lastWeekVolume = entries.filter((e) => e.date >= lastWeekStart && e.date <= lastWeekEnd).reduce((s, e) => s + computeEntryVolume(e), 0);
  const thisWeekDays = new Set(entries.filter((e) => e.date >= thisWeekStart).map((e) => e.date)).size;
  const volumeChangePct = lastWeekVolume > 0 ? Math.round(((thisWeekVolume - lastWeekVolume) / lastWeekVolume) * 100) : null;

  function changeRange(key) {
    setRange(key);
    setOffset(0);
  }

  const width = 320;
  const height = 156;
  const padX = 8;
  const padTop = 20;
  const padBottom = 20;
  const volumes = series.map((s) => s.volume);
  const maxV = Math.max(1, ...volumes);
  const slot = (width - padX * 2) / series.length;
  const barW = Math.max(3, slot * 0.68);
  const plotH = height - padTop - padBottom;
  const fmtVol = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)}k` : String(Math.round(v)));

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週の総重量</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{Math.round(thisWeekVolume).toLocaleString()}<span style={{ fontSize: 11, color: "#A8A8A8" }}>kg</span></p>
          {volumeChangePct !== null && (
            <p style={{ fontSize: 11, margin: "4px 0 0", color: volumeChangePct >= 0 ? "#6FBF7A" : ACCENT, fontWeight: 700 }}>
              先週比 {volumeChangePct >= 0 ? "+" : ""}{volumeChangePct}%
            </p>
          )}
        </div>
        <div style={{ flex: 1, background: "#161616", border: "1px solid #363636", borderRadius: 14, padding: "14px 14px" }}>
          <p style={{ fontSize: 10, color: "#A8A8A8", margin: "0 0 4px", textTransform: "uppercase", fontFamily: "'Oswald', sans-serif" }}>今週のトレ日数</p>
          <p style={{ fontSize: 20, fontWeight: 700, color: "#F5F5F5", margin: 0, fontFamily: "'Oswald', sans-serif" }}>{thisWeekDays}<span style={{ fontSize: 11, color: "#A8A8A8" }}>日</span></p>
          <p style={{ fontSize: 11, margin: "4px 0 0", color: "#7A7A7A" }}>先週: {Math.round(lastWeekVolume).toLocaleString()}kg</p>
        </div>
      </div>

      <div style={{ background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "16px 18px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <p style={{ fontSize: 13, fontWeight: 700, margin: 0, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>総重量の推移</p>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ key: "week", label: "週間" }, { key: "month", label: "月間" }].map((opt) => (
              <button
                key={opt.key}
                onClick={() => changeRange(opt.key)}
                style={{
                  fontSize: 11, padding: "4px 10px", borderRadius: 999,
                  border: range === opt.key ? `1px solid ${ACCENT}` : "1px solid #363636",
                  background: range === opt.key ? "rgba(232,53,43,0.12)" : "transparent",
                  color: range === opt.key ? ACCENT : "#A8A8A8", fontWeight: 600, cursor: "pointer",
                }}
              >
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <button
            onClick={() => setOffset((o) => o + 1)}
            aria-label="前の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: "pointer" }}
          >
            ‹
          </button>
          <span style={{ fontSize: 11, color: "#7A7A7A" }}>{series[0].label} 〜 {series[series.length - 1].label}</span>
          <button
            onClick={() => setOffset((o) => Math.max(0, o - 1))}
            disabled={offset === 0}
            aria-label="次の期間"
            style={{ background: "transparent", border: "1px solid #363636", color: offset === 0 ? "#4A4A4A" : "#F5F5F5", borderRadius: 8, width: 28, height: 28, cursor: offset === 0 ? "default" : "pointer" }}
          >
            ›
          </button>
        </div>

        <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="総重量の推移グラフ">
          <line x1={padX} x2={width - padX} y1={height - padBottom} y2={height - padBottom} stroke="#363636" />
          {series.map((s, i) => {
            const x = padX + i * slot + (slot - barW) / 2;
            const h = (s.volume / maxV) * plotH;
            const y = height - padBottom - h;
            const showValue = range === "week" && s.volume > 0;
            const showLabel = range === "week" || i % 5 === 0 || i === series.length - 1;
            return (
              <g key={i}>
                <rect x={x} y={s.volume > 0 ? y : height - padBottom - 2} width={barW} height={s.volume > 0 ? h : 2} rx="2" fill={s.volume > 0 ? ACCENT : "#2A2A2A"} />
                {showValue && <text x={x + barW / 2} y={y - 4} textAnchor="middle" fontSize="9" fontWeight="700" fill="#D6D6D6">{fmtVol(s.volume)}</text>}
                {showLabel && <text x={x + barW / 2} y={height - 6} textAnchor="middle" fontSize="8" fill="#7A7A7A">{s.label}</text>}
              </g>
            );
          })}
        </svg>
        <p style={{ fontSize: 11, color: "#7A7A7A", marginTop: 10 }}>総重量 = 重量 × 回数の合計(自重セットは含みません)</p>
      </div>
    </div>
  );
}

function NutritionTab({ log, goal, bodyWeightLog, onAddMeal, onDeleteMeal, onSetGoal }) {
  const [date, setDate] = useState(todayStr());
  const [name, setName] = useState("");
  const [protein, setProtein] = useState("");
  const [kcal, setKcal] = useState("");
  const [goalDraft, setGoalDraft] = useState(goal ? String(goal) : "");
  const [goalOpen, setGoalOpen] = useState(false);

  const meals = log[date] || [];
  const totalProtein = meals.reduce((sum, m) => sum + (m.protein || 0), 0);
  const totalKcal = meals.reduce((sum, m) => sum + (m.kcal || 0), 0);
  const latestWeight = bodyWeightLog.length
    ? [...bodyWeightLog].sort((a, b) => (a.date < b.date ? 1 : -1))[0].weight
    : null;
  const pct = goal ? Math.min(100, Math.round((totalProtein / goal) * 100)) : 0;

  function handleAdd() {
    const p = parseFloat(protein);
    const k = parseFloat(kcal);
    if (isNaN(p) && isNaN(k) && !name.trim()) return;
    onAddMeal(date, { id: String(Date.now()), name: name.trim(), protein: isNaN(p) ? 0 : p, kcal: isNaN(k) ? 0 : k });
    setName(""); setProtein(""); setKcal("");
  }

  function saveGoal() {
    const g = parseFloat(goalDraft);
    onSetGoal(isNaN(g) || g <= 0 ? null : g);
    setGoalOpen(false);
  }

  // Last 7 days of protein totals
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const key = dateStrOffset(-i);
    const total = (log[key] || []).reduce((sum, m) => sum + (m.protein || 0), 0);
    days.push({ key, total, label: key.slice(5).replace("-", "/") });
  }
  const maxVal = Math.max(goal || 0, ...days.map((d) => d.total), 1);
  const W = 320;
  const H = 120;
  const barW = 28;
  const gap = (W - barW * 7) / 8;
  const tracked = days.filter((d) => d.total > 0);
  const avg = tracked.length ? Math.round(tracked.reduce((sum, d) => sum + d.total, 0) / tracked.length) : 0;

  const card = { background: "#161616", border: "1px solid #363636", borderRadius: 16, padding: "14px 16px", marginBottom: 14 };
  const input = { padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 13 };

  return (
    <div>
      <input
        type="date" value={date} max={todayStr()}
        onChange={(e) => e.target.value && setDate(e.target.value)}
        style={{ ...input, width: "100%", marginBottom: 12, colorScheme: "dark" }}
      />

      <div style={card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 8 }}>
          <div>
            <p style={{ margin: 0, fontSize: 11, color: "#A8A8A8", fontFamily: "'Oswald', sans-serif", textTransform: "uppercase" }}>タンパク質</p>
            <p style={{ margin: "2px 0 0", fontSize: 28, fontWeight: 700, color: "#F5F5F5", fontFamily: "'Oswald', sans-serif" }}>
              {Math.round(totalProtein * 10) / 10}<span style={{ fontSize: 13, color: "#A8A8A8" }}>g{goal ? ` / ${goal}g` : ""}</span>
            </p>
          </div>
          <div style={{ textAlign: "right" }}>
            {totalKcal > 0 && <p style={{ margin: 0, fontSize: 13, color: "#D6D6D6" }}>{Math.round(totalKcal)} kcal</p>}
            {latestWeight && totalProtein > 0 && (
              <p style={{ margin: "2px 0 0", fontSize: 11, color: "#7A7A7A" }}>体重あたり {(totalProtein / latestWeight).toFixed(1)}g/kg</p>
            )}
          </div>
        </div>
        {goal ? (
          <div style={{ height: 8, background: "#0A0A0A", borderRadius: 4, overflow: "hidden", border: "1px solid #363636" }}>
            <div style={{ width: `${pct}%`, height: "100%", background: pct >= 100 ? "#3DBE7A" : ACCENT }} />
          </div>
        ) : null}
        <button
          onClick={() => setGoalOpen((v) => !v)}
          style={{ background: "transparent", border: "none", color: "#A8A8A8", fontSize: 11, cursor: "pointer", marginTop: 8, padding: 0 }}
        >
          {goal ? "目標を変更" : "1日の目標タンパク質量を設定"}
        </button>
        {goalOpen && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input type="number" inputMode="decimal" placeholder="目標 g/日(例: 120)" value={goalDraft} onChange={(e) => setGoalDraft(e.target.value)} style={{ ...input, flex: 1 }} />
            <button onClick={saveGoal} style={{ padding: "0 16px", borderRadius: 8, border: "none", background: ACCENT, color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>保存</button>
          </div>
        )}
      </div>

      <div style={card}>
        <p style={{ margin: "0 0 10px", fontSize: 12, fontWeight: 700, color: "#F5F5F5" }}>食事を追加</p>

        </div>

      {meals.length > 0 && (

                <p style={{ margin: 0, fontSize: 13, color: "#F5F5F5", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.name || "食事"}</p>
                <p style={{ margin: "2px 0 0", fontSize: 11, color: "#7A7A7A" }}>
                  {m.protein ? `${m.protein}g` : ""}{m.protein && m.kcal ? " ・ " : ""}{m.kcal ? `${m.kcal}kcal` : ""}
                </p>
              </div>
              <button onClick={() => onDeleteMeal(date, m.id)} style={{ background: "transparent", border: "none", color: "#7A7A7A", fontSize: 11, cursor: "pointer", flexShrink: 0 }}>削除</button>
            </div>
          ))}
        </div>
      )}

      <div style={card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: "#F5F5F5" }}>直近7日のタンパク質</p>
          {avg > 0 && <span style={{ fontSize: 11, color: "#A8A8A8" }}>平均 {avg}g/日</span>}
        </div>
        <svg width="100%" viewBox={`0 0 ${W} ${H + 18}`} role="img" aria-label="直近7日のタンパク質摂取量">
          {goal ? (
            <line x1="0" x2={W} y1={H - (goal / maxVal) * H} y2={H - (goal / maxVal) * H} stroke="#6B332F" strokeDasharray="4 4" />
          ) : null}
          {days.map((d, i) => {
            const h = (d.total / maxVal) * H;
            const x = gap + i * (barW + gap);
            return (
              <g key={d.key}>
                <rect x={x} y={H - h} width={barW} height={Math.max(h, d.total > 0 ? 2 : 0)} rx="4" fill={goal && d.total >= goal ? "#3DBE7A" : ACCENT} />
                <text x={x + barW / 2} y={H + 13} textAnchor="middle" fontSize="9" fill="#7A7A7A">{d.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
    </div>
  );
}

function MachineSettingsTab({ defaults, onChange, customExercises }) {
  const [query, setQuery] = useState("");
  const [showAll, setShowAll] = useState(false);
  const allNames = useMemo(() => {
    const set = new Set();
    CATEGORIES.forEach((c) => getCategoryExercises(c, customExercises).forEach((n) => {
      const e = getEquipment(n);
      if (e === "machine" || e === "cable") set.add(n);
    }));
    Object.keys(defaults).forEach((n) => set.add(n));
    return [...set];
  }, [customExercises, defaults]);
  const q = query.trim().toLowerCase();
  const registered = allNames.filter((n) => defaults[n] && (defaults[n].weight || defaults[n].memo)).sort((a, b) => a.localeCompare(b, "ja"));
  const regSet = new Set(registered);
  let others = allNames.filter((n) => !regSet.has(n)).sort((a, b) => a.localeCompare(b, "ja"));
  if (q) others = others.filter((n) => n.toLowerCase().includes(q));
  const shownOthers = q || showAll ? others : [];

  function row(name) {
    const d = defaults[name] || {};
    return (
      <div key={name} style={{ background: "#161616", border: "1px solid #363636", borderRadius: 12, padding: "10px 12px", marginBottom: 8 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: "#F5F5F5", minWidth: 0 }}>{name}</span>
          <EquipTag name={name} />
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <WeightInput value={d.weight === undefined ? "" : String(d.weight)} onChange={(v) => onChange(name, { weight: v, memo: d.memo || "" })} placeholder="初期重量kg" />
          <input
            type="text" value={d.memo || ""} maxLength={20} placeholder="シート位置など"
            onChange={(e) => onChange(name, { weight: d.weight === undefined ? "" : String(d.weight), memo: e.target.value })}
            style={{ flex: 1, minWidth: 0, padding: "9px 10px", borderRadius: 8, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 13 }}
          />
        </div>
      </div>
    );
  }

  return (
    <div>
      <p style={{ fontSize: 12, color: "#A8A8A8", margin: "0 0 14px", lineHeight: 1.6 }}>
        マシンやケーブル種目の「最初に使う重量」とシート位置をメモできます。まだ記録がない種目を選んだとき、重量が自動で入ります。
      </p>
      <p style={{ fontSize: 12, fontWeight: 700, margin: "0 0 8px", color: "#A8A8A8" }}>登録済み <span style={{ fontWeight: 500, color: "#7A7A7A" }}>{registered.length}</span></p>
      {registered.length === 0 && <p style={{ fontSize: 12, color: "#7A7A7A", margin: "0 0 14px" }}>まだ登録がありません。下の検索から種目を探して入力してください。</p>}
      {registered.map(row)}

      <p style={{ fontSize: 12, fontWeight: 700, margin: "18px 0 8px", color: "#A8A8A8" }}>種目を探して登録</p>
      <input
        type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="種目を検索(例: レッグプレス)"
        style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: "1px solid #363636", background: "#0A0A0A", color: "#F5F5F5", fontSize: 14, marginBottom: 10 }}
      />
      {shownOthers.map(row)}
      {!q && !showAll && (
        <button onClick={() => setShowAll(true)} style={{ width: "100%", padding: "10px 0", borderRadius: 10, border: "1px dashed #363636", background: "transparent", color: "#A8A8A8", fontSize: 12, cursor: "pointer" }}>
          未登録のマシン・ケーブル種目をすべて表示 ({others.length})
        </button>
      )}
      {q && others.length === 0 && <p style={{ fontSize: 12, color: "#7A7A7A" }}>該当する種目がありません</p>}
    </div>
  );
}

function HomeTab({ entries, runLog, sessions, lastBackupAt, onBackupNow, onOpenMachines, machineCount }) {

  return (

      >
        <span style={{ textAlign: "left" }}>
          <span style={{ display: "block", fontSize: 14, fontWeight: 700 }}>マシンの初期重量</span>
          <span style={{ display: "block", fontSize: 11, color: "#7A7A7A", marginTop: 2 }}>{machineCount > 0 ? `${machineCount}種目を登録済み` : "最初に使う重量・シート位置をメモ"}</span>
